<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extraction Pipeline</title>
<style>
:root {
  --color-bg: #fafafa;
  --color-surface: #ffffff;
  --color-surface-hover: #f5f5f6;
  --color-border: #e7e7ea;
  --color-border-strong: #d6d6db;
  --color-text: #131316;
  --color-text-secondary: #57575f;
  --color-text-muted: #6f6f78;

  --color-accent: #4f46e5;
  --color-accent-hover: #4338ca;
  --color-accent-bg: #f0f0fe;

  --color-action: #131316;
  --color-action-hover: #303036;

  --color-success: #15803d;
  --color-success-bg: #ecfdf3;
  --color-success-border: #86e0ac;

  --color-info: #1d4ed8;
  --color-info-bg: #eff4ff;
  --color-info-border: #a8c6fb;

  --color-danger: #b3261e;
  --color-danger-bg: #fdecea;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 10px;

  --font-xs: 11px;
  --font-sm: 12.5px;
  --font-base: 13.5px;
  --font-md: 14.5px;
  --font-lg: 17px;
  --font-xl: 20px;

  --shadow-sm: 0 1px 2px rgba(15,15,20,.05);
  --shadow-md: 0 8px 24px rgba(15,15,20,.10), 0 1px 2px rgba(15,15,20,.04);
  --focus-ring: 0 0 0 2px var(--color-surface), 0 0 0 4px var(--color-accent);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: var(--font-md);
  background: var(--color-bg);
  color: var(--color-text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

a { color: var(--color-accent); }

svg { display: block; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: 8px; top: -48px; z-index: 100;
  background: var(--color-text); color: #fff; padding: 10px 16px;
  border-radius: var(--radius-md); font-size: var(--font-sm); font-weight: 600;
  transition: top .15s;
}
.skip-link:focus { top: 8px; }

:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

header {
  background: #131316; color: #fff; padding: var(--space-4) var(--space-6);
  display: flex; align-items: center; gap: var(--space-3);
}
.brand-mark {
  width: 18px; height: 18px; border-radius: 5px;
  background: linear-gradient(135deg, var(--color-accent), #8b7ff0);
  flex-shrink: 0;
}
header .app-title { font-size: var(--font-lg); font-weight: 600; letter-spacing: -.2px; }
header .app-subtitle { font-size: var(--font-sm); color: #96969f; padding-left: var(--space-2); border-left: 1px solid #38383f; margin-left: 2px; }

.layout { display: grid; grid-template-columns: 272px 1fr; height: calc(100vh - 54px); }

.sidebar {
  background: var(--color-surface); border-right: 1px solid var(--color-border);
  overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4);
}
.main { overflow-y: auto; padding: var(--space-6) var(--space-6) var(--space-7, 56px); }
.main:focus-visible { outline: none; }

.upload-area {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 1.5px dashed var(--color-border-strong);
  border-radius: var(--radius-lg); padding: var(--space-4); text-align: center;
  cursor: pointer; transition: all .15s; color: var(--color-text-secondary); font-size: var(--font-base);
}
.upload-area:hover, .upload-area.over { border-color: var(--color-accent); background: var(--color-accent-bg); color: var(--color-accent); }
.upload-area:focus-within { border-color: var(--color-accent); box-shadow: var(--focus-ring); }
.upload-input {
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
}
.upload-icon { margin-bottom: var(--space-1); opacity: .8; }
.upload-hint { font-size: var(--font-xs); margin-top: 1px; color: var(--color-text-muted); }

.papers-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.papers-toolbar-label { font-size: var(--font-xs); color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.papers-list { display: flex; flex-direction: column; gap: 2px; }
.paper-card { border-radius: var(--radius-md); border-left: 2px solid transparent; }
.paper-card.active { background: var(--color-accent-bg); border-left-color: var(--color-accent); }
.paper-select-btn {
  display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: var(--space-2) var(--space-3) 6px; border-radius: 0 var(--radius-md) 0 0;
}
.paper-card:not(.active) .paper-select-btn:hover { background: var(--color-surface-hover); }
.paper-name { font-weight: 500; word-break: break-all; font-size: var(--font-base); }

.stage-buttons { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 var(--space-3) var(--space-2); }
.btn-stage {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px 3px 7px; font-size: var(--font-xs); border-radius: 999px;
  border: 1px solid var(--color-border-strong); background: var(--color-surface); cursor: pointer;
  color: var(--color-text-secondary); font-weight: 500; transition: all .12s;
}
.btn-stage .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-border-strong); flex-shrink: 0; }
.btn-stage:hover:not(:disabled) { border-color: var(--color-text); color: var(--color-text); }
.btn-stage:disabled { color: #c6c6cc; border-color: #ececef; cursor: not-allowed; }
.btn-stage:disabled .dot { background: #dcdce0; }
.btn-stage.done { color: var(--color-success); border-color: var(--color-success-border); background: var(--color-success-bg); }
.btn-stage.done .dot { background: var(--color-success); }
.btn-stage.done:hover:not(:disabled) { border-color: var(--color-success); }
.btn-stage.running { color: var(--color-info); border-color: var(--color-info-border); background: var(--color-info-bg); cursor: wait; }
.btn-stage.running .dot { background: var(--color-info); animation: pulse 1.1s ease-in-out infinite; }
.btn-stage.all { background: var(--color-action); color: #fff; border-color: var(--color-action); }
.btn-stage.all .dot { background: #fff; }
.btn-stage.all:hover:not(:disabled) { background: var(--color-action-hover); border-color: var(--color-action-hover); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

.sidebar-nav { margin-top: auto; padding-top: var(--space-3); border-top: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 1px; }
.nav-link {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
  color: var(--color-text-secondary); font-size: var(--font-base); font-weight: 500;
}
.nav-link:hover { background: var(--color-surface-hover); color: var(--color-text); }
.nav-link svg { opacity: .65; flex-shrink: 0; }
.nav-link:hover svg { opacity: .9; }

.btn {
  padding: 7px var(--space-3); border-radius: var(--radius-md); border: 1px solid transparent;
  cursor: pointer; font-size: var(--font-sm); font-weight: 500; transition: background .1s, border-color .1s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-block { width: 100%; justify-content: center; }
.btn-primary { background: var(--color-action); color: #fff; }
.btn-primary:hover { background: var(--color-action-hover); }
.btn-secondary { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border-strong); }
.btn-secondary:hover { background: var(--color-surface-hover); border-color: var(--color-text-muted); }
.btn-sm { padding: 2px 8px; font-size: var(--font-xs); border-radius: var(--radius-sm); border: 1px solid var(--color-border-strong); background: var(--color-surface); cursor: pointer; color: var(--color-text-secondary); }
.btn-sm:hover { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
.btn-icon {
  background: none; border: none; cursor: pointer; color: #c6c6cc; font-size: 18px; line-height: 1; padding: var(--space-1);
  border-radius: var(--radius-sm);
}
.btn-icon:hover { color: var(--color-danger); background: var(--color-danger-bg); }

.status-bar { padding: var(--space-3) var(--space-4); background: var(--color-info-bg); border-radius: var(--radius-md); color: var(--color-info); font-size: var(--font-base); margin-bottom: var(--space-5); min-height: 40px; display: flex; align-items: center; }

.tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-6); }
.tab {
  padding: var(--space-2) var(--space-4) 11px; cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--color-text-muted);
  font-weight: 500; font-size: var(--font-base); transition: all .12s;
}
.tab:hover { color: var(--color-text); }
.tab[aria-selected="true"] { border-bottom-color: var(--color-accent); color: var(--color-text); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.table-wrap { border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: var(--color-surface); }
th { background: #fbfbfc; padding: var(--space-3) var(--space-4); text-align: left; font-weight: 600; border-bottom: 1px solid var(--color-border); font-size: var(--font-base); }
td, th[scope="row"] { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); vertical-align: top; }
tr:last-child td, tr:last-child th { border-bottom: none; }
th[scope="row"] { font-weight: 500; width: 160px; white-space: nowrap; text-align: left; }

.conf { font-weight: 600; font-size: var(--font-xs); text-transform: uppercase; letter-spacing: .3px; }
.conf-high   { color: var(--color-success); }
.conf-medium { color: #92400e; }
.conf-low    { color: var(--color-danger); }

.decision { display: inline-block; font-weight: 600; font-size: var(--font-xs); text-transform: uppercase; letter-spacing: .3px; padding: 2px 8px; border-radius: 999px; }
.decision-include { color: var(--color-success); background: var(--color-success-bg); }
.decision-exclude { color: var(--color-danger); background: var(--color-danger-bg); }
.decision-maybe   { color: #92400e; background: #fffbeb; }
.decision-missing { color: var(--color-text-secondary); background: var(--color-surface-hover); }

.accordion { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
.acc-header {
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: var(--space-3) var(--space-4); font-weight: 500; border-bottom: 1px solid var(--color-border);
  display: flex; justify-content: space-between; align-items: center; gap: var(--space-3);
}
.acc-header:hover { background: var(--color-surface-hover); }
.acc-meta { font-size: var(--font-xs); color: var(--color-text-muted); font-weight: 400; white-space: nowrap; }
.acc-body { display: none; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-border); background: var(--color-bg); }
.acc-body.open { display: block; }
.accordion > div:last-child .acc-body { border-bottom: none; }

.chunk { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-3); margin-bottom: var(--space-2); }
.chunk:last-child { margin-bottom: 0; }
.chunk-meta { font-size: var(--font-xs); color: var(--color-text-muted); margin-bottom: var(--space-2); font-family: ui-monospace, "SF Mono", monospace; }
.chunk-text { font-size: var(--font-base); line-height: 1.6; white-space: pre-wrap; }
.chunk-actions { margin-top: var(--space-2); display: flex; gap: var(--space-2); }
.tag { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 999px; margin: 2px 4px 0 0; font-weight: 500; }
.tag-dense { background: var(--color-accent-bg); color: var(--color-accent); }
.tag-sparse { background: #fffbeb; color: #b45309; }

.empty { color: var(--color-text-muted); padding: var(--space-6); text-align: center; font-size: var(--font-base); }
.section-title { font-size: var(--font-xl); font-weight: 650; letter-spacing: -.3px; margin-bottom: 4px; }
.section-sub   { color: var(--color-text-muted); font-size: var(--font-base); margin-bottom: var(--space-5); }

.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5); margin-bottom: var(--space-4); position: relative; }
.card-heading { font-size: var(--font-xs); color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: var(--space-3); }
.field-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--space-3); }
.field-row:last-child { margin-bottom: 0; }
.field-label { font-size: var(--font-sm); font-weight: 600; color: var(--color-text-secondary); display: block; }
.field-hint { color: var(--color-text-muted); font-weight: 400; }
.field-input {
  width: 100%; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  padding: 7px 10px; font-size: var(--font-base); font-family: inherit; resize: vertical; background: var(--color-surface); color: var(--color-text);
}
.field-input:focus-visible { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 3px rgba(79,70,229,.12); }
.field-input.mono { font-family: ui-monospace, "SF Mono", monospace; }
.required { color: var(--color-danger); }

.btn-add { border: 1.5px dashed var(--color-border-strong); background: none; width: 100%; padding: var(--space-3); border-radius: var(--radius-lg); cursor: pointer; color: var(--color-text-muted); font-size: var(--font-base); font-weight: 500; transition: all .15s; }
.btn-add:hover { border-color: var(--color-accent); color: var(--color-accent); background: var(--color-accent-bg); }

.toolbar { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-5); flex-wrap: wrap; }
.status-msg { font-size: var(--font-base); }
.status-msg.ok  { color: var(--color-success); }
.status-msg.err { color: var(--color-danger); }
.status-msg.pending { color: var(--color-text-muted); }

.form-grid { display: flex; gap: var(--space-2); margin-bottom: var(--space-3); flex-wrap: wrap; align-items: flex-end; }
.form-grid .field-row { margin-bottom: 0; }
.field-inline { display: flex; align-items: center; gap: 6px; font-size: var(--font-sm); color: var(--color-text-secondary); white-space: nowrap; }

.score-row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: 7px; font-size: var(--font-base); }
.score-bar-wrap { flex: 1; background: var(--color-border); border-radius: 999px; overflow: hidden; height: 6px; }
.score-bar { height: 100%; background: var(--color-accent); border-radius: 999px; }
.score-val { font-family: ui-monospace, "SF Mono", monospace; font-size: var(--font-xs); color: var(--color-text-secondary); width: 60px; text-align: right; }
.criterion-review-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-3); }
.criterion-review-card:last-child { margin-bottom: 0; }
.criterion-review-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-2); }
.criterion-review-actions { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.btn-sm.selected { background: var(--color-action); color: #fff; border-color: var(--color-action); }
.model-assessment { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--color-border); }
.model-assessment-heading { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-3); }
.model-hidden { margin-top: var(--space-3); padding: var(--space-3); border-radius: var(--radius-sm); background: var(--color-surface-hover); color: var(--color-text-muted); font-size: var(--font-sm); }
.nli-score-row { display: grid; grid-template-columns: 105px minmax(120px, 1fr) 52px; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
.nli-score-label { font-size: var(--font-sm); color: var(--color-text-secondary); }
.nli-score-track { position: relative; height: 10px; background: var(--color-border); border-radius: 999px; }
.nli-score-fill { height: 100%; border-radius: 999px; }
.nli-score-entailment { background: #2563eb; }
.nli-score-contradiction { background: #7c3aed; }
.nli-score-neutral { background: #64748b; }
.nli-threshold-marker { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--color-text); border-radius: 1px; transform: translateX(-1px); }
.nli-score-value { font-family: ui-monospace, "SF Mono", monospace; font-size: var(--font-xs); color: var(--color-text-secondary); text-align: right; }
.review-agreement { font-size: var(--font-xs); font-weight: 600; }
.review-agreement.yes { color: var(--color-success); }
.review-agreement.no { color: var(--color-danger); }
</style>
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to main content</a>
<header>
  <span class="brand-mark" aria-hidden="true"></span>
  <span class="app-title">Extraction Pipeline</span>
  <span class="app-subtitle">systematic review data extraction</span>
</header>
<div class="layout">

  <nav class="sidebar" aria-label="Papers and settings">
    <label class="upload-area" id="uploadArea" for="fileInput">
      <input class="upload-input" type="file" id="fileInput" accept=".pdf" onchange="handleFileSelect(this)" aria-label="Upload PDF">
      <svg class="upload-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6"/>
        <path d="M12 18v-6"/><path d="M9.5 14.5 12 12l2.5 2.5"/>
      </svg>
      <div>Upload PDF</div>
      <div class="upload-hint">click or drag &amp; drop</div>
    </label>

    <div class="papers-toolbar">
      <span class="papers-toolbar-label">Papers</span>
      <button type="button" class="btn-sm" onclick="runAllPapers()">Run all</button>
    </div>
    <div class="papers-list" id="papersList" aria-label="Papers" role="list">
      <div class="empty">No papers yet</div>
    </div>
    <p id="bulkStatus" class="acc-meta" role="status" aria-live="polite" style="min-height:14px"></p>

    <div class="sidebar-nav">
      <button class="nav-link" onclick="openFields()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Extraction plan
      </button>
      <button class="nav-link" onclick="openTools()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        Tools
      </button>
      <button class="nav-link" onclick="openSettings()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </button>
      <button class="nav-link" onclick="openExport()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        Export
      </button>
      <button class="nav-link" onclick="openScreening()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Screening
      </button>
    </div>
  </nav>

  <main class="main" id="mainContent" tabindex="-1">
    <div class="empty" style="padding-top:80px">Select a paper from the sidebar</div>
  </main>

</div>
<script src="/static/screening-setup.js"></script>
<script>
let currentPaper = null;
const running = new Set();


async function handleFileSelect(input) {
  const file = input.files[0];
  if (file) await doUpload(file);
  input.value = '';
}

async function doUpload(file) {
  const fd = new FormData();
  fd.append('file', file);
  await fetch('/upload', { method: 'POST', body: fd });
  await refreshPapers();
}

const ua = document.getElementById('uploadArea');
ua.addEventListener('dragover',  e => { e.preventDefault(); ua.classList.add('over'); });
ua.addEventListener('dragleave', () => ua.classList.remove('over'));
ua.addEventListener('drop', async e => {
  e.preventDefault(); ua.classList.remove('over');
  const file = e.dataTransfer.files[0];
  if (file) await doUpload(file);
});


function stemBusy(stem) {
  return [...running].some(k => k.startsWith(`${stem}:`));
}

function stageBtn(stem, stage, label, enabled, done, isAll = false) {
  const key = `${stem}:${stage}`;
  const isRunning = running.has(key);
  const busy = stemBusy(stem);
  const isDisabled = isRunning || (busy && !isRunning) || (!enabled && !isRunning);
  const cls = isRunning ? 'btn-stage running' : isAll ? 'btn-stage all' : done ? 'btn-stage done' : 'btn-stage';
  const text = isRunning ? '…' : label;
  const stateLabel = isRunning ? `${label}: running` : done ? `${label}: done` : label;
  return `<button type="button" class="${cls}" ${isDisabled ? 'disabled' : ''} aria-label="${esc(stateLabel)}"
    data-paper-action="stage" data-stem="${esc(stem)}" data-stage="${esc(stage)}"><span class="dot" aria-hidden="true"></span>${esc(text)}</button>`;
}

async function refreshPapers() {
  const papers = await fetch('/papers').then(r => r.json());
  const el = document.getElementById('papersList');
  if (!papers.length) { el.innerHTML = '<div class="empty">No papers yet</div>'; return; }
  el.innerHTML = papers.map(p => `
    <div class="paper-card ${currentPaper === p.stem ? 'active' : ''}" role="listitem">
      <button type="button" class="paper-select-btn" aria-current="${currentPaper === p.stem ? 'true' : 'false'}" data-paper-action="select" data-stem="${esc(p.stem)}">
        <span class="paper-name">${esc(p.stem)}</span>
      </button>
      <div class="stage-buttons">
        ${stageBtn(p.stem, 'parse',    'Parse',    p.has_pdf,    p.has_parsed)}
        ${stageBtn(p.stem, 'index',    'Index',    p.has_parsed, p.has_index)}
        ${stageBtn(p.stem, 'retrieve', 'Retrieve', p.has_index,  p.has_evidence)}
        ${stageBtn(p.stem, 'extract',      'Extract',  p.has_evidence,    p.has_extraction)}
        ${stageBtn(p.stem, 'extract-full', 'Full',     p.has_parsed,      p.has_full_extraction)}
        ${stageBtn(p.stem, 'run',          'All',      p.has_pdf,         false, true)}
      </div>
    </div>`).join('');
}

document.getElementById('papersList').addEventListener('click', event => {
  const control = event.target.closest('[data-paper-action]');
  if (!control) return;
  if (control.dataset.paperAction === 'select') selectPaper(control.dataset.stem);
  if (control.dataset.paperAction === 'stage') runStage(control.dataset.stem, control.dataset.stage);
});


async function runStage(stem, stage) {
  const key = `${stem}:${stage}`;
  if (running.has(key)) return;
  running.add(key);
  await refreshPapers();

  const res = await fetch(`/papers/${encodeURIComponent(stem)}/${stage}`, { method: 'POST' });
  if (!res.ok) {
    running.delete(key);
    await refreshPapers();
    const err = await res.json().catch(() => ({}));
    alert(err.detail || 'Request failed');
    return;
  }

  const { job_id } = await res.json();
  const t = setInterval(async () => {
    const job = await fetch(`/jobs/${job_id}`).then(r => r.json());
    if (currentPaper === stem) {
      const sb = document.getElementById('statusBar');
      if (sb) sb.textContent = `Working: ${job.message}`;
    }
    if (job.status === 'done' || job.status === 'error') {
      clearInterval(t);
      running.delete(key);
      if (job.status === 'error') alert(`Error in ${stage}:\n${job.error}`);
      await refreshPapers();
      if (currentPaper === stem) selectPaper(stem);
    }
  }, 1500);
}


async function runAllPapers() {
  const bulkStatus = document.getElementById('bulkStatus');
  if (!confirm('Run the full pipeline (parse → index → retrieve → extract) on every paper that isn\'t already fully processed? This will make real LLM calls.')) return;

  const res = await fetch('/papers/run-all', { method: 'POST' });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    alert(err.detail || 'Request failed');
    return;
  }
  const { job_ids, skipped } = await res.json();
  const stems = Object.keys(job_ids);
  if (!stems.length) {
    bulkStatus.textContent = `Nothing to run — ${skipped.length} paper(s) already fully processed or missing a PDF.`;
    return;
  }
  stems.forEach(stem => running.add(`${stem}:run`));
  await refreshPapers();
  pollBulkRun(job_ids);
}

function pollBulkRun(jobIds) {
  const bulkStatus = document.getElementById('bulkStatus');
  const entries = Object.entries(jobIds);
  const t = setInterval(async () => {
    const statuses = await Promise.all(entries.map(([, jobId]) => fetch(`/jobs/${jobId}`).then(r => r.json())));
    const finished = statuses.filter(s => s.status === 'done' || s.status === 'error').length;
    bulkStatus.textContent = `Running: ${finished} / ${entries.length} paper(s) done`;
    entries.forEach(([stem], i) => {
      if (statuses[i].status === 'done' || statuses[i].status === 'error') running.delete(`${stem}:run`);
    });
    if (finished === entries.length) {
      clearInterval(t);
      const errors = statuses.filter(s => s.status === 'error').length;
      bulkStatus.textContent = errors
        ? `Finished with ${errors} error(s) out of ${entries.length} — check individual papers.`
        : `Finished — ${entries.length} paper(s) processed.`;
      refreshPapers();
    } else {
      refreshPapers();
    }
  }, 2000);
}


async function selectPaper(stem) {
  currentPaper = stem;
  await refreshPapers();
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="section-title">${esc(stem)}</div>
    <div class="status-bar" id="statusBar" role="status" aria-live="polite">Select a stage to run, or click a tab to view results.</div>
    <div class="tabs" role="tablist" aria-label="Paper views">
      <button type="button" class="tab" role="tab" id="tabbtn-comparison" aria-selected="true"  aria-controls="tab-comparison" onclick="switchTab('comparison',this)">Comparison</button>
      <button type="button" class="tab" role="tab" id="tabbtn-evidence"   aria-selected="false" aria-controls="tab-evidence"   onclick="switchTab('evidence',this)">Retrieve</button>
      <button type="button" class="tab" role="tab" id="tabbtn-selected"   aria-selected="false" aria-controls="tab-selected"   onclick="switchTab('selected',this)">Selected</button>
      <button type="button" class="tab" role="tab" id="tabbtn-chunks"     aria-selected="false" aria-controls="tab-chunks"     onclick="switchTab('chunks',this)">Chunks</button>
    </div>
    <div class="tab-panel active" id="tab-comparison" role="tabpanel" aria-labelledby="tabbtn-comparison"><div class="empty">Loading…</div></div>
    <div class="tab-panel"        id="tab-evidence"   role="tabpanel" aria-labelledby="tabbtn-evidence" hidden><div class="empty">Loading…</div></div>
    <div class="tab-panel"        id="tab-selected"   role="tabpanel" aria-labelledby="tabbtn-selected" hidden><div class="empty">Loading…</div></div>
    <div class="tab-panel"        id="tab-chunks"     role="tabpanel" aria-labelledby="tabbtn-chunks"   hidden><div class="empty">Loading…</div></div>`;

  loadComparison(stem);
  loadEvidence(stem);
  loadSelected(stem);
  loadChunks(stem);
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', 'false'));
  document.querySelectorAll('.tab-panel').forEach(p => { p.classList.remove('active'); p.hidden = true; });
  el.setAttribute('aria-selected', 'true');
  const panel = document.getElementById(`tab-${name}`);
  panel.classList.add('active');
  panel.hidden = false;
}


async function loadComparison(stem) {
  const el = document.getElementById('tab-comparison');
  const [r1, r2] = await Promise.all([
    fetch(`/papers/${encodeURIComponent(stem)}/extraction`),
    fetch(`/papers/${encodeURIComponent(stem)}/full_extraction`),
  ]);
  if (!r1.ok && !r2.ok) { el.innerHTML = '<div class="empty">No extraction results yet.</div>'; return; }
  const ext  = r1.ok ? await r1.json() : {};
  const full = r2.ok ? await r2.json() : {};
  const fields = [...new Set([...Object.keys(ext), ...Object.keys(full)])];
  el.innerHTML = `<div class="table-wrap"><table>
    <caption class="visually-hidden">Extracted values compared between RAG and full-paper strategies</caption>
    <thead><tr><th scope="col">Field</th><th scope="col">RAG</th><th scope="col">Full Paper</th></tr></thead>
    <tbody>${fields.map(f => `
      <tr>
        <th scope="row">${esc(f)}</th>
        <td>${fmtExt(ext[f])}</td>
        <td>${fmtExt(full[f])}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
}

function fmtExt(item) {
  if (!item) return '<span style="color:var(--color-text-muted)">—</span>';
  const cc = { high: 'conf-high', medium: 'conf-medium', low: 'conf-low' }[item.confidence] || '';
  const raw = item.value;
  const valStr = raw == null
    ? null
    : typeof raw === 'object' ? JSON.stringify(raw) : String(raw);
  const val = valStr != null ? esc(valStr) : '<em style="color:var(--color-text-muted)">null</em>';
  const quote = item.source_quote ? ` title="${esc(item.source_quote)}"` : '';
  const section = item.source_section ? `<span style="font-size:var(--font-xs);color:var(--color-text-muted);margin-left:6px">${esc(item.source_section)}</span>` : '';
  const status = item.status ? `<span class="tag">${esc(item.status)}</span>` : '';
  const error = item.error ? `<div class="status-msg err">${esc(item.error)}</div>` : '';
  return `<div${quote}>${val}</div><div style="margin-top:4px">${status}<span class="conf ${cc}">${esc(item.confidence ?? '')}</span>${section}</div>${error}`;
}


async function loadEvidence(stem) {
  const el = document.getElementById('tab-evidence');
  const res = await fetch(`/papers/${encodeURIComponent(stem)}/retrieve-debug`);
  if (!res.ok) { el.innerHTML = '<div class="empty">No retrieve results yet — run Retrieve first.</div>'; return; }
  const debug = await res.json();
  el.innerHTML = `<div class="accordion">${Object.entries(debug).map(([label, d], i) => fieldRetrieveHTML(label, d, i)).join('')}</div>`;
}

function toggleAcc(btn) {
  const body = document.getElementById(btn.getAttribute('aria-controls'));
  const open = body.classList.toggle('open');
  btn.setAttribute('aria-expanded', String(open));
}

function fieldRetrieveHTML(label, d, i) {
  const kept = d.kept || [];
  const bodyId = `retrieve-body-${i}`;
  return `
    <div>
      <button type="button" class="acc-header" aria-expanded="true" aria-controls="${bodyId}" onclick="toggleAcc(this)">
        <span>${esc(label)}</span>
        <span class="acc-meta">dense ${d.dense.length} · sparse ${d.sparse.length} · intersection ${d.intersection.length} · kept ${kept.length}</span>
      </button>
      <div class="acc-body open" id="${bodyId}">
        ${kept.length ? kept.map(retrieveChunkHTML).join('') : '<div class="empty">No chunks retrieved</div>'}
      </div>
    </div>`;
}

function retrieveChunkHTML(c) {
  const denseTags  = (c.matched_by?.dense  || []).map(q => `<span class="tag tag-dense">${esc(q)}</span>`).join('');
  const sparseTags = (c.matched_by?.sparse || []).map(k => `<span class="tag tag-sparse">${esc(k)}</span>`).join('');
  return `
    <div class="chunk">
      <div class="chunk-meta">${esc(c.id)} · §${esc(c.section)} · ${esc(c.kind)}</div>
      <div class="chunk-text">${esc(c.text)}</div>
      <div style="margin-top:6px">${denseTags}${sparseTags}</div>
    </div>`;
}


async function loadSelected(stem) {
  const el = document.getElementById('tab-selected');
  const res = await fetch(`/papers/${encodeURIComponent(stem)}/evidence`);
  if (!res.ok) { el.innerHTML = '<div class="empty">No evidence yet — run Retrieve first.</div>'; return; }
  const evidence = await res.json();
  el.innerHTML = `<div class="accordion">${Object.entries(evidence).map(([label, chunks], i) => fieldSelectedHTML(label, chunks, i)).join('')}</div>`;
}

function fieldSelectedHTML(label, chunks, i) {
  const bodyId = `selected-body-${i}`;
  return `
    <div>
      <button type="button" class="acc-header" aria-expanded="true" aria-controls="${bodyId}" onclick="toggleAcc(this)">
        <span>${esc(label)}</span>
        <span class="acc-meta">${chunks.length} chunk${chunks.length === 1 ? '' : 's'} sent to the LLM, in document order</span>
      </button>
      <div class="acc-body open" id="${bodyId}">
        ${chunks.length ? chunks.map(selectedChunkHTML).join('') : '<div class="empty">No chunks selected</div>'}
      </div>
    </div>`;
}

function selectedChunkHTML(c) {
  return `
    <div class="chunk">
      <div class="chunk-meta">${esc(c.id)} · §${esc(c.section)} · ${esc(c.kind)}</div>
      <div class="chunk-text">${esc(c.text)}</div>
    </div>`;
}


async function loadChunks(stem) {
  const el = document.getElementById('tab-chunks');
  const res = await fetch(`/papers/${encodeURIComponent(stem)}/chunks`);
  if (!res.ok) { el.innerHTML = '<div class="empty">No chunks yet — run Index first.</div>'; return; }
  const chunks = await res.json();
  el.innerHTML = `
    <p style="color:var(--color-text-muted);margin-bottom:var(--space-3);font-size:var(--font-base)">${chunks.length} chunks</p>
    ${chunks.map(c => `
      <div class="chunk" style="margin-bottom:6px">
        <div class="chunk-meta">${esc(c.id)} · §${esc(c.section)} · ${esc(c.kind)} · ${esc(c.tokens)} tokens</div>
        <div class="chunk-text">${esc(c.text)}</div>
      </div>`).join('')}`;
}


function esc(s) {
  const str = (s == null) ? '' : (typeof s === 'object' ? JSON.stringify(s) : String(s));
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function deselectPaper() {
  currentPaper = null;
  refreshPapers();
}


let _fieldGroups = [];
let _fieldsJsonMode = false;

async function openFields() {
  deselectPaper();
  const table = await fetch('/data-table').then(res => res.json());
  _fieldGroups = table.groups.map(group => ({ ...group, fields: group.fields.map(field => ({ ...field })) }));
  renderFieldEditor();
}

function currentFieldsSchema() { return { schema_version: '3.0', groups: _fieldGroups }; }

function renderFieldEditor() {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <h1 class="section-title">Full-text Extraction Plan</h1>
    <p class="section-sub">Define exactly what the full-text module must extract. Add or remove topic groups and fields, then complete each field's form. Every field is retrieved independently; related fields are extracted together and validated separately.</p>
    <div class="toolbar">
      <button type="button" class="btn btn-primary" onclick="saveFields()">Save extraction plan</button>
      <button type="button" class="btn btn-secondary" onclick="saveAndGeneratePlan()">Save &amp; generate retrieval queries</button>
      <button type="button" class="btn btn-secondary" onclick="openPlan()">View/edit generated queries</button>
      <button type="button" class="btn btn-secondary" onclick="toggleFieldsJson()">${_fieldsJsonMode ? 'Group editor' : 'Edit JSON'}</button>
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('fieldsJsonFile').click()">Import JSON</button>
      <button type="button" class="btn btn-secondary" onclick="downloadFieldsJson()">Download JSON</button>
      <input id="fieldsJsonFile" type="file" accept="application/json,.json" hidden onchange="importFieldsJson(this.files[0]);this.value=''">
      <span id="fieldStatus" class="status-msg" role="status" aria-live="polite"></span>
    </div>
    ${_fieldsJsonMode ? `
      <div class="card">
        <div class="card-heading">Full-text extraction plan JSON</div>
        <textarea class="field-input" id="fieldsJsonEditor" rows="28" spellcheck="false">${esc(JSON.stringify(currentFieldsSchema(), null, 2))}</textarea>
        <div class="toolbar" style="margin-top:var(--space-3)"><button type="button" class="btn btn-primary" onclick="applyFieldsJson()">Apply JSON</button></div>
      </div>` : `
      <div id="fieldsContainer">${_fieldGroups.map((group, i) => fieldGroupHTML(group, i)).join('')}</div>
      <button type="button" class="btn-add" onclick="addFieldGroup()">+ Add topic group</button>`}`;
}

function fieldGroupHTML(group, groupIndex) {
  return `
    <div class="card" id="field-group-${groupIndex}">
      <div class="card-heading">Topic group ${groupIndex + 1}</div>
      <button type="button" class="btn-icon" style="position:absolute;top:14px;right:16px" onclick="deleteFieldGroup(${groupIndex})" aria-label="Remove group ${groupIndex + 1}">×</button>
      <div class="field-row">
        <label class="field-label" for="group-${groupIndex}-label">Topic label <span class="required">*</span></label>
        <input class="field-input" id="group-${groupIndex}-label" value="${esc(group.label || '')}" placeholder="e.g. Population" oninput="_fieldGroups[${groupIndex}].label=this.value">
      </div>
      <div style="margin-left:var(--space-4)">
        ${group.fields.map((field, i) => fieldCardHTML(field, groupIndex, i)).join('') || '<p class="empty">No extraction fields in this group.</p>'}
        <button type="button" class="btn-add" onclick="addField(${groupIndex})">+ Add field to ${esc(group.label || 'this topic')}</button>
      </div>
    </div>`;
}

function fieldCardHTML(field, groupIndex, fieldIndex) {
  const prefix = `field-${groupIndex}-${fieldIndex}`;
  return `
    <div class="card" id="${prefix}">
      <div class="card-heading">Extraction field ${fieldIndex + 1}</div>
      <button type="button" class="btn-icon" style="position:absolute;top:14px;right:16px" onclick="deleteField(${groupIndex},${fieldIndex})" aria-label="Remove extraction field ${fieldIndex + 1}">×</button>
      <div class="field-row"><label class="field-label" for="${prefix}-label">Label <span class="required">*</span></label>
        <input class="field-input" id="${prefix}-label" value="${esc(field.label || '')}" placeholder="e.g. Sample size recruited" oninput="updateField(${groupIndex},${fieldIndex},'label',this.value)"></div>
      <div class="field-row"><label class="field-label" for="${prefix}-desc">Retrieval question <span class="required">*</span></label>
        <textarea class="field-input" id="${prefix}-desc" rows="2" placeholder="What exact fact should be found?" oninput="updateField(${groupIndex},${fieldIndex},'description',this.value)">${esc(field.description || '')}</textarea></div>
      <div class="field-row"><label class="field-label" for="${prefix}-rules">Extraction rules <span class="field-hint">(optional; not sent to the planner)</span></label>
        <textarea class="field-input" id="${prefix}-rules" rows="2" placeholder="Final extraction and validation instructions" oninput="updateField(${groupIndex},${fieldIndex},'rules',this.value)">${esc(field.rules || '')}</textarea></div>
      <div class="form-grid">
        <div class="field-row"><label class="field-label" for="${prefix}-id">Stable ID <span class="field-hint">(generated from the label if blank)</span></label>
          <input class="field-input" id="${prefix}-id" value="${esc(field.id || '')}" placeholder="sample_size_recruited" oninput="updateField(${groupIndex},${fieldIndex},'id',this.value)"></div>
        <div class="field-row"><label class="field-label" for="${prefix}-type">Value type</label>
          <select class="field-input" id="${prefix}-type" onchange="updateField(${groupIndex},${fieldIndex},'value_type',this.value)">${['string','integer','number','boolean','array'].map(type => `<option value="${type}" ${field.value_type === type ? 'selected' : ''}>${type}</option>`).join('')}</select></div>
        <div class="field-row" style="flex:2"><label class="field-label" for="${prefix}-allowed">Allowed values <span class="field-hint">(optional, comma-separated)</span></label>
          <input class="field-input" id="${prefix}-allowed" value="${esc((field.allowed_values || []).join(', '))}" oninput="updateField(${groupIndex},${fieldIndex},'allowed_values',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></div>
      </div>
    </div>`;
}

function updateField(groupIndex, fieldIndex, key, value) {
  _fieldGroups[groupIndex].fields[fieldIndex][key] = value;
}
function fieldIdFromLabel(label) {
  return label.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
}
function emptyExtractionField() {
  return { id: '', label: '', description: '', rules: '', value_type: 'string', allowed_values: null };
}
function addFieldGroup() {
  _fieldGroups.push({ label: '', fields: [emptyExtractionField()] });
  renderFieldEditor();
  document.getElementById(`group-${_fieldGroups.length - 1}-label`)?.focus();
}
function deleteFieldGroup(groupIndex) { _fieldGroups.splice(groupIndex, 1); renderFieldEditor(); }
function addField(groupIndex) {
  _fieldGroups[groupIndex].fields.push(emptyExtractionField());
  const fieldIndex = _fieldGroups[groupIndex].fields.length - 1;
  renderFieldEditor();
  document.getElementById(`field-${groupIndex}-${fieldIndex}-label`)?.focus();
}
function deleteField(groupIndex, fieldIndex) { _fieldGroups[groupIndex].fields.splice(fieldIndex, 1); renderFieldEditor(); }

function parseFieldsJson(rawText) {
  const parsed = JSON.parse(rawText);
  if (!parsed || !Array.isArray(parsed.groups)) throw new Error('The schema needs a "groups" array.');
  for (const group of parsed.groups) {
    if (!group || typeof group.label !== 'string' || !Array.isArray(group.fields)) throw new Error('Every group needs a label and a fields array.');
  }
  return parsed.groups.map(group => ({ ...group, fields: group.fields.map(field => ({ ...field })) }));
}

function setFieldStatus(message, kind) {
  const status = document.getElementById('fieldStatus');
  if (status) { status.textContent = message; status.className = `status-msg ${kind}`; }
}

function toggleFieldsJson() {
  if (_fieldsJsonMode) {
    try { _fieldGroups = parseFieldsJson(document.getElementById('fieldsJsonEditor').value); }
    catch (error) { setFieldStatus(error.message, 'err'); return; }
  }
  _fieldsJsonMode = !_fieldsJsonMode;
  renderFieldEditor();
}

function applyFieldsJson() {
  try {
    _fieldGroups = parseFieldsJson(document.getElementById('fieldsJsonEditor').value);
    document.getElementById('fieldsJsonEditor').value = JSON.stringify(currentFieldsSchema(), null, 2);
    setFieldStatus('JSON applied — save to persist it.', 'ok');
  } catch (error) { setFieldStatus(error.message, 'err'); }
}

async function importFieldsJson(file) {
  if (!file) return;
  try {
    _fieldGroups = parseFieldsJson(await file.text());
    _fieldsJsonMode = true;
    renderFieldEditor();
    setFieldStatus(`Imported ${file.name} — save to persist it.`, 'ok');
  } catch (error) { setFieldStatus(error.message, 'err'); }
}

function downloadFieldsJson() {
  if (_fieldsJsonMode) {
    try { _fieldGroups = parseFieldsJson(document.getElementById('fieldsJsonEditor').value); }
    catch (error) { setFieldStatus(error.message, 'err'); return; }
  }
  const blob = new Blob([JSON.stringify(currentFieldsSchema(), null, 2) + '\n'], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'data_table.json';
  link.click();
  URL.revokeObjectURL(url);
}

async function saveFields() {
  if (_fieldsJsonMode) {
    try { _fieldGroups = parseFieldsJson(document.getElementById('fieldsJsonEditor').value); }
    catch (error) { setFieldStatus(error.message, 'err'); return false; }
  }
  const fields = _fieldGroups.flatMap(group => group.fields);
  const status = document.getElementById('fieldStatus');
  if (_fieldGroups.some(group => !group.label?.trim())) { status.textContent = 'Every group needs a label.'; status.className = 'status-msg err'; return false; }
  if (_fieldGroups.some(group => !group.fields.length)) { status.textContent = 'Every group needs at least one extraction field.'; status.className = 'status-msg err'; return false; }
  if (!fields.length || fields.some(field => !field.label?.trim() || !field.description?.trim())) { status.textContent = 'Every field needs a label and retrieval question.'; status.className = 'status-msg err'; return false; }
  const cleanGroups = _fieldGroups.map(group => ({
    label: group.label.trim(),
    fields: group.fields.map(field => {
      const clean = { id: field.id?.trim() || fieldIdFromLabel(field.label), label: field.label.trim(), description: field.description.trim(), value_type: field.value_type || 'string' };
      if (field.rules?.trim()) clean.rules = field.rules.trim();
      if (field.allowed_values?.length) clean.allowed_values = field.allowed_values;
      return clean;
    }),
  }));
  const res = await fetch('/data-table', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ schema_version: '3.0', groups: cleanGroups }) });
  if (res.ok) {
    const saved = await res.json();
    _fieldGroups = cleanGroups;
    status.textContent = saved.status === 'saved_queries_invalidated'
      ? 'Saved - fields changed, so retrieval queries must be regenerated.'
      : 'Saved';
    status.className = 'status-msg ok';
    return true;
  } else {
    const err = await res.json().catch(() => ({}));
    status.textContent = err.detail || 'Save failed';
    status.className = 'status-msg err';
    return false;
  }
}

async function saveAndGeneratePlan() {

  await openPlan();
  const planStatus = document.getElementById('planStatus');
  planStatus.textContent = 'Extraction plan saved and queries generated';
  planStatus.className = 'status-msg ok';
}

function planCardHTML(label, i) {
  const entry = _plan[label] || { queries: [], keywords: [] };
  return `

function updatePlanField(index, key, rawText) {
  const label = _planLabels[index];
  if (!_plan[label]) _plan[label] = { queries: [], keywords: [] };
  _plan[label][key] = rawText.split('\n').map(s => s.trim()).filter(Boolean);

async function postJSON(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

}

let _lastSearchResults = [];

async function runSearch(method) {
  const stem = document.getElementById('toolPaper').value;
  const query = document.getElementById('toolQuery').value.trim();
  const top_n = Number(document.getElementById('toolTopN').value) || 5;
  const el = document.getElementById('searchResults');
  if (!stem) { el.innerHTML = '<p class="status-msg err">No indexed paper selected.</p>'; return; }
  if (!query) { el.innerHTML = '<p class="status-msg err">Enter a query.</p>'; return; }
  el.innerHTML = '<p class="status-msg pending">Searching…</p>';
  try {
    const endpoint = { dense: '/tools/dense-search', bm25: '/tools/bm25-search', stem: '/tools/stem-search', splade: '/tools/splade-search' }[method];
    _lastSearchResults = await postJSON(endpoint, { stem, query, top_n });
    el.innerHTML = _lastSearchResults.length
      ? _lastSearchResults.map((c, i) => toolChunkHTML(c, i)).join('')
      : '<p class="empty">No matches.</p>';
  } catch (e) {
    el.innerHTML = `<p class="status-msg err">${esc(e.message)}</p>`;
  }
}

function toolChunkHTML(c, i) {
  return `
    <div class="chunk">
      <div class="chunk-meta">${esc(c.id)} · §${esc(c.section)} · ${esc(c.kind)}</div>
      <div class="chunk-text">${esc(c.text)}</div>
      <div class="chunk-actions">
        <button type="button" class="btn-sm" onclick="sendToRerank(${i})">→ Rerank</button>
        <button type="button" class="btn-sm" onclick="sendToNli(${i})">→ NLI</button>
      </div>
    </div>`;
}

function sendToRerank(i) {
  const text = _lastSearchResults[i].text;
  const docs = document.getElementById('rerankDocs');
  docs.value += (docs.value ? '\n' : '') + text;
  docs.scrollIntoView({ behavior: 'smooth', block: 'center' });
  docs.focus();
}

function sendToNli(i) {
  const premise = document.getElementById('nliPremise');
  premise.value = _lastSearchResults[i].text;
  premise.scrollIntoView({ behavior: 'smooth', block: 'center' });
  premise.focus();
}

async function runEncode() {
  const text = document.getElementById('encodeText').value.trim();
  const is_query = document.getElementById('encodeIsQuery').checked;
  const el = document.getElementById('encodeResult');
  if (!text) { el.innerHTML = '<span class="status-msg err">Enter text to embed.</span>'; return; }
  el.textContent = 'Encoding…';
  try {
    const r = await postJSON('/tools/encode', { text, is_query });
    const preview = r.vector.slice(0, 6).map(v => v.toFixed(4)).join(', ');
    el.innerHTML = `dim=<b>${r.dim}</b> · norm=<b>${r.norm.toFixed(4)}</b> · vector preview: [${esc(preview)}, …]`;
  } catch (e) {
    el.innerHTML = `<span class="status-msg err">${esc(e.message)}</span>`;
  }
}

function scoreRowsHTML(items, labelKey, scoreKey) {
  const max = Math.max(...items.map(i => i[scoreKey]), 1e-9);
  return items.map(i => `
    <div class="score-row">
      <div class="score-val">${i[scoreKey].toFixed(4)}</div>
      <div class="score-bar-wrap"><div class="score-bar" style="width:${Math.max(2, i[scoreKey] / max * 100)}%"></div></div>
      <div style="flex:2">${esc(i[labelKey])}</div>
    </div>`).join('');
}

async function runRerank() {
  const query = document.getElementById('rerankQuery').value.trim();
  const documents = document.getElementById('rerankDocs').value.split('\n').map(s => s.trim()).filter(Boolean);

  el.innerHTML = '<p class="status-msg pending">Loading model (first call can take a few seconds)…</p>';
  try {
    const results = await postJSON('/tools/rerank', { query, documents });
    el.innerHTML = scoreRowsHTML(results, 'document', 'score');

      <div class="form-grid screening-llm-setting">
        <div class="field-row">
          <label class="field-label" for="setupConcurrentRequests">Parallel API requests</label>
          <input class="field-input" id="setupConcurrentRequests" type="number" min="1" max="16" step="1" value="${llm.max_concurrent_requests ?? 1}">
          <span class="field-hint">Maximum simultaneous requests within one screening or panel batch. Use 1 for constrained local models.</span>
        </div>
        <div class="field-row">
          <label class="field-label" for="setupMaxOutputTokens">Initial output-token budget</label>
          <input class="field-input" id="setupMaxOutputTokens" type="number" min="16" step="1" value="${llm.max_output_tokens}">
        </div>
        <div class="field-row">
          <label class="field-label" for="setupOutputRetryMultiplier">Truncation retry multiplier</label>
          <input class="field-input" id="setupOutputRetryMultiplier" type="number" min="1.01" max="8" step="0.25" value="${llm.output_token_retry_multiplier ?? 2}">
        </div>
      </div>
      <details class="screening-llm-setting" style="margin:var(--space-3) 0">
        <summary class="field-label">System prompts</summary>
        <p class="field-hint">The active primary prompt depends on the evaluation mode. The overall prompt is also the default for an LLM second reviewer. Prompt changes apply to the next run and invalidate incompatible checkpoints; no server restart is needed.</p>
        <div class="field-row">
          <label class="field-label" for="setupAllCriteriaPrompt">Overall decision (all criteria)</label>
          <textarea class="field-input mono" id="setupAllCriteriaPrompt" rows="8" spellcheck="false">${esc(_screeningPrompts.all_criteria)}</textarea>
        </div>
        <div class="field-row">
          <label class="field-label" for="setupPerCriterionPrompt">Per-criterion assessment</label>
          <textarea class="field-input mono" id="setupPerCriterionPrompt" rows="8" spellcheck="false">${esc(_screeningPrompts.per_criterion)}</textarea>
        </div>
        <div class="field-row screening-panel-setting">
          <label class="field-label" for="setupJudgePrompt">Adjudication judge</label>
          <textarea class="field-input mono" id="setupJudgePrompt" rows="8" spellcheck="false">${esc(_screeningPrompts.judge)}</textarea>
        </div>
        <div class="toolbar" style="margin-top:var(--space-3);margin-bottom:0">
          <button type="button" class="btn btn-secondary" onclick="saveScreeningPrompts()">Save system prompts</button>
          <span id="screeningPromptStatus" class="status-msg" role="status" aria-live="polite"></span>
        </div>
      </details>
      <label class="field-label screening-panel-setting"><input id="setupPanelEnabled" type="checkbox" ${panel.enabled ? 'checked' : ''} onchange="toggleScreeningSetupFields()"> Enable independent review panel</label>
      <div id="screeningPanelSettings" class="form-grid" style="margin-top:var(--space-3)">
        <div class="field-row">
          <label class="field-label" for="setupSecondKind">Second reviewer</label>
          <select class="field-input" id="setupSecondKind" onchange="toggleScreeningSetupFields()">
            <option value="human" ${panel.second_reviewer.kind === 'human' ? 'selected' : ''}>Human</option>
            <option value="llm" ${panel.second_reviewer.kind === 'llm' ? 'selected' : ''}>LLM</option>
          </select>
          <input class="field-input panel-second-model" id="setupSecondModel" value="${esc(panel.second_reviewer.llm?.model || llm.model)}" placeholder="Second model">
        </div>
        <div class="field-row">
          <label class="field-label" for="setupJudgeKind">Judge on disagreement</label>
          <select class="field-input" id="setupJudgeKind" onchange="toggleScreeningSetupFields()">
            <option value="human" ${panel.judge.kind === 'human' ? 'selected' : ''}>Human</option>
            <option value="llm" ${panel.judge.kind === 'llm' ? 'selected' : ''}>LLM</option>
          </select>
          <input class="field-input panel-judge-model" id="setupJudgeModel" value="${esc(panel.judge.llm?.model || llm.model)}" placeholder="Judge model">
        </div>
        <label class="field-inline"><input id="setupJudgeReason" type="checkbox" ${panel.require_judge_reason !== false ? 'checked' : ''}> Require the judge to explain the final decision</label>
      </div>
      <div id="screeningSetupSummary">${screeningSetupSummaryHTML()}</div>
      <div class="toolbar" style="margin:var(--space-3) 0 0">
        <button type="button" class="btn btn-primary" onclick="saveScreeningSetup()">Save screening setup</button>
        <button type="button" class="btn btn-secondary" onclick="openSettings()">Advanced settings</button>
        <span id="screeningSetupStatus" class="status-msg" role="status" aria-live="polite"></span>
      </div>
      <p class="field-hint">Provider URLs, prompts, reasoning effort, retry limits, and other deployment options remain available in Advanced Settings.</p>
    </div>`;
}

function screeningPanelActor(kind, current, primary, model) {
  if (kind === 'human') return {kind: 'human', llm: null};
  const llm = {...(current?.llm || primary)};
  llm.model = model.trim();
  llm.execution_mode = 'all_criteria';
  llm.allow_uncertainty = false;
  return {kind: 'llm', llm};
}

function screeningSetupDraft() {
  const screening = structuredClone(_screeningThresholds);
  screening.backend = document.getElementById('setupBackend').value;
  screening.llm.execution_mode = document.getElementById('setupExecutionMode').value;
  screening.llm.include_reason = document.getElementById('setupReason').checked;
  screening.llm.extract_evidence = document.getElementById('setupEvidence').checked;
  screening.llm.allow_uncertainty = screening.llm.execution_mode === 'per_criterion' && document.getElementById('setupUncertainty').checked;
  screening.llm.include_confidence_score = document.getElementById('setupConfidence').checked;
  screening.llm.max_concurrent_requests = Number(document.getElementById('setupConcurrentRequests').value);
  screening.llm.max_output_tokens = Number(document.getElementById('setupMaxOutputTokens').value);
  screening.llm.output_token_retry_multiplier = Number(document.getElementById('setupOutputRetryMultiplier').value);
  screening.panel.enabled = screening.backend === 'llm' && document.getElementById('setupPanelEnabled').checked;
  screening.panel.require_judge_reason = document.getElementById('setupJudgeReason').checked;
  screening.panel.second_reviewer = screeningPanelActor(
    document.getElementById('setupSecondKind').value,
    screening.panel.second_reviewer,
    screening.llm,
    document.getElementById('setupSecondModel').value,
  );
  screening.panel.judge = screeningPanelActor(
    document.getElementById('setupJudgeKind').value,
    screening.panel.judge,
    screening.llm,
    document.getElementById('setupJudgeModel').value,
  );
  return screening;
}

function toggleScreeningSetupFields() {
  const llm = document.getElementById('setupBackend')?.value === 'llm';
  const perCriterion = document.getElementById('setupExecutionMode')?.value === 'per_criterion';
  const panel = document.getElementById('setupPanelEnabled')?.checked;
  document.querySelectorAll('.screening-panel-setting').forEach(element => element.style.display = llm ? '' : 'none');
  if (!llm && document.getElementById('setupPanelEnabled')) document.getElementById('setupPanelEnabled').checked = false;
  document.querySelectorAll('.screening-llm-setting').forEach(element => element.style.display = llm ? '' : 'none');
  document.querySelectorAll('.screening-per-criterion-setting').forEach(element => element.style.display = perCriterion ? '' : 'none');
  const panelSettings = document.getElementById('screeningPanelSettings');
  if (panelSettings) panelSettings.style.display = llm && panel ? '' : 'none';
  document.querySelectorAll('.panel-second-model').forEach(element => element.style.display = panel && document.getElementById('setupSecondKind').value === 'llm' ? '' : 'none');
  document.querySelectorAll('.panel-judge-model').forEach(element => element.style.display = panel && document.getElementById('setupJudgeKind').value === 'llm' ? '' : 'none');
  const summary = document.getElementById('screeningSetupSummary');
  if (summary) summary.innerHTML = screeningSetupSummaryHTML(null, screeningSetupDraft());
}

function applyScreeningPreset(name) {
  if (name === 'nli') {
    document.getElementById('setupBackend').value = 'nli';
    document.getElementById('setupPanelEnabled').checked = false;
  } else if (name === 'explainable') {
    document.getElementById('setupBackend').value = 'llm';
    document.getElementById('setupExecutionMode').value = 'per_criterion';
    document.getElementById('setupReason').checked = true;
    document.getElementById('setupEvidence').checked = true;
    document.getElementById('setupUncertainty').checked = true;
    document.getElementById('setupConfidence').checked = false;
    document.getElementById('setupPanelEnabled').checked = false;
  } else if (name === 'independent') {
    document.getElementById('setupBackend').value = 'llm';
    document.getElementById('setupPanelEnabled').checked = true;
    document.getElementById('setupSecondKind').value = 'human';
    document.getElementById('setupJudgeKind').value = 'human';
  }
  toggleScreeningSetupFields();
}

async function saveScreeningSetup() {
  const status = document.getElementById('screeningSetupStatus');
  const screening = screeningSetupDraft();
  if (!Number.isInteger(screening.llm.max_concurrent_requests) || screening.llm.max_concurrent_requests < 1 || screening.llm.max_concurrent_requests > 16) {
    status.textContent = 'Parallel API requests must be an integer from 1 to 16.';
    status.className = 'status-msg err';
    return;
  }
  if (!Number.isInteger(screening.llm.max_output_tokens) || screening.llm.max_output_tokens < 16) {
    status.textContent = 'The initial output-token budget must be an integer of at least 16.';
    status.className = 'status-msg err';
    return;
  }
  if (!(screening.llm.output_token_retry_multiplier > 1 && screening.llm.output_token_retry_multiplier <= 8)) {
    status.textContent = 'The truncation retry multiplier must be greater than 1 and at most 8.';
    status.className = 'status-msg err';
    return;
  }
  for (const actor of [screening.panel.second_reviewer, screening.panel.judge]) {
    if (screening.panel.enabled && actor.kind === 'llm' && !actor.llm.model.trim()) {
      status.textContent = 'Every LLM review role needs a model name.';
      status.className = 'status-msg err';
      return;
    }
  }
  const cfg = await fetch('/config').then(response => response.json());
  cfg.screening = screening;
  const response = await fetch('/config', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(cfg),
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    status.textContent = typeof body.detail === 'string' ? body.detail : 'Validation failed; open Advanced Settings for details.';
    status.className = 'status-msg err';
    return;
  }
  _screeningThresholds = screening;
  status.textContent = body.status === 'saved_restart_required' ? 'Saved. Restart the server before screening.' : 'Saved.';
  status.className = 'status-msg ok';
  toggleScreeningSetupFields();
}

async function saveScreeningPrompts() {
  const status = document.getElementById('screeningPromptStatus');
  const prompts = {
    all_criteria: document.getElementById('setupAllCriteriaPrompt').value.trim(),
    per_criterion: document.getElementById('setupPerCriterionPrompt').value.trim(),
    judge: document.getElementById('setupJudgePrompt').value.trim(),
  };
  if (Object.values(prompts).some(value => !value)) {
    status.textContent = 'System prompts cannot be empty.';
    status.className = 'status-msg err';
    return;
  }
  const response = await fetch('/screening/prompts', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(prompts),
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    status.textContent = typeof body.detail === 'string' ? body.detail : 'Could not save system prompts.';
    status.className = 'status-msg err';
    return;
  }
  _screeningPrompts = prompts;
  status.textContent = 'Saved. The prompts will be used on the next screening run.';
  status.className = 'status-msg ok';
}

async function openScreening() {
  deselectPaper();
  const [criteriaRes, cfg, batches, prompts] = await Promise.all([
    fetch('/screening/criteria').then(r => r.json()),
    fetch('/config').then(r => r.json()),
    fetch('/screening/batches').then(r => r.json()),
    fetch('/screening/prompts').then(r => r.json()),
  ]);
  _screeningCriteria = criteriaRes.criteria.map(c => ({ ...c }));
  _screeningThresholds = { ...cfg.screening };
  _screeningBatches = batches;
  _screeningPrompts = prompts;
  renderScreening();
}

function updateScreeningCriterion(i, key, value) { _screeningCriteria[i][key] = value; }

function addScreeningCriterion() {
  _screeningCriteria.push({ label: '', statement: '', type: 'include', confidence_threshold: _screeningThresholds.confidence_threshold });
  renderScreening();
  document.getElementById(`screening-${_screeningCriteria.length - 1}-label`)?.focus();
}

function deleteScreeningCriterion(i) {
  _screeningCriteria.splice(i, 1);
  renderScreening();
}

async function saveScreeningCriteria() {
  const invalid = _screeningCriteria.filter(c =>
    !c.label.trim() || !c.statement.trim() ||
    !Number.isFinite(Number(c.confidence_threshold)) || c.confidence_threshold < 0.5 || c.confidence_threshold > 1
  );
  const status = document.getElementById('screeningCriteriaStatus');
  if (invalid.length) { status.textContent = 'Every criterion needs a label, statement, and threshold between 0.5 and 1.0.'; status.className = 'status-msg err'; return; }

  const clean = _screeningCriteria.map(c => ({
    label: c.label.trim(), statement: c.statement.trim(), type: c.type,
    confidence_threshold: Number(c.confidence_threshold),
    explicit_evidence_required: c.type === 'include' && Boolean(c.explicit_evidence_required),
  }));
  const res = await fetch('/screening/criteria', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ criteria: clean }),
  });
  if (res.ok) {
    _screeningCriteria = clean;
    status.textContent = 'Saved ✓'; status.className = 'status-msg ok';
  } else {
    const err = await res.json().catch(() => ({}));
    status.textContent = err.detail || 'Save failed'; status.className = 'status-msg err';
  }
}

async function saveScreeningThresholds() {
  const status = document.getElementById('screeningThresholdStatus');
  const cfg = await fetch('/config').then(r => r.json());
  cfg.screening.confidence_threshold = parseFloat(document.getElementById('confidenceThreshold').value);
  const res = await fetch('/config', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cfg) });
  if (res.ok) {
    _screeningThresholds = cfg.screening;
    status.textContent = 'Saved ✓'; status.className = 'status-msg ok';
  } else {
    const err = await res.json().catch(() => ({}));
    status.textContent = err.detail || 'Save failed'; status.className = 'status-msg err';
  }
}

async function handleScreeningFileSelect(input) {
  const file = input.files[0];
  if (file) await doScreeningUpload(file);
  input.value = '';
}

async function doScreeningUpload(file) {
  const status = document.getElementById('screeningUploadStatus');
  status.textContent = 'Uploading…'; status.className = 'status-msg pending';
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch('/screening/upload', { method: 'POST', body: fd });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    status.textContent = data.detail || 'Upload failed'; status.className = 'status-msg err';
    return;
  }
  status.textContent = `Uploaded ${data.paper_count} paper(s) ✓`; status.className = 'status-msg ok';
  _screeningBatches = await fetch('/screening/batches').then(r => r.json());
  _screeningSelectedBatch = data.batch_id;
  document.getElementById('screeningBatchList').innerHTML = screeningBatchListHTML();
  document.getElementById('screeningResultsSection').innerHTML = '';
}

function screeningBatchListHTML() {
  if (!_screeningBatches.length) return '<p class="empty">No citation files uploaded yet.</p>';
  return `<div class="table-wrap"><table>
    <caption class="visually-hidden">Uploaded screening batches</caption>
    <thead><tr><th scope="col">File</th><th scope="col">Papers</th><th scope="col">Status</th><th scope="col">Actions</th></tr></thead>

      <tr>

          <button type="button" class="btn-sm" onclick="runScreeningBatch('${b.batch_id}')">Run</button>

          ${b.has_results ? `<a class="btn-sm" href="/screening/${b.batch_id}/results.xlsx" download>Download</a>` : ''}
