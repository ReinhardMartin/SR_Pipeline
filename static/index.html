}

async function runScreeningBatch(batchId) {
  const status = document.getElementById('screeningUploadStatus');
  if (!_screeningCriteria.length) { alert('Define at least one screening criterion first.'); return; }
  const batch = _screeningBatches.find(item => item.batch_id === batchId);
  const detail = screeningSetupDetails(_screeningThresholds, batch?.paper_count || 0, _screeningCriteria.length);
  const calls = detail.minimumCalls === detail.maximumCalls ? detail.minimumCalls : `${detail.minimumCalls}-${detail.maximumCalls}`;
  const warningText = detail.warnings.length ? `\n\nWarnings:\n- ${detail.warnings.join('\n- ')}` : '';
  const approved = confirm(
    `Run screening with this setup?\n\nPrimary: ${detail.primary}\nOutputs: ${detail.outputs}\nSecond reviewer: ${detail.secondReviewer}\nJudge: ${detail.judge}\nEstimated model calls: ${calls}${warningText}`
  );
  if (!approved) return;
  status.textContent = 'Screening…'; status.className = 'status-msg pending';
  const res = await fetch(`/screening/${batchId}/run`, { method: 'POST' });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    status.textContent = data.detail || 'Failed to start screening'; status.className = 'status-msg err';
    return;
  }
  const t = setInterval(async () => {
    const job = await fetch(`/jobs/${data.job_id}`).then(r => r.json());
    if (job.status === 'done' || job.status === 'error') {
      clearInterval(t);
      if (job.status === 'error') {
        status.textContent = `Error: ${job.error}`; status.className = 'status-msg err';
        return;
      }
      status.textContent = 'Screening complete ✓'; status.className = 'status-msg ok';
      _screeningBatches = await fetch('/screening/batches').then(r => r.json());
      document.getElementById('screeningBatchList').innerHTML = screeningBatchListHTML();
      loadScreeningResults(batchId);
    }
  }, 1500);
}

async function deleteScreeningBatch(batchId) {
  if (!confirm('Delete this batch and its results?')) return;
  await fetch(`/screening/${batchId}`, { method: 'DELETE' });
  _screeningBatches = await fetch('/screening/batches').then(r => r.json());
  document.getElementById('screeningBatchList').innerHTML = screeningBatchListHTML();
  if (_screeningSelectedBatch === batchId) {
    _screeningSelectedBatch = null;
    document.getElementById('screeningResultsSection').innerHTML = '';
  }
}

function screeningViewState(section) {
  return {
    openRows: Array.from(section.querySelectorAll('.acc-header[aria-expanded="true"][data-paper-row]')).map(
      header => header.dataset.paperRow
    ),
    scrollY: window.scrollY,
  };
}

function restoreScreeningViewState(section, state) {
  if (!state) return;
  state.openRows.forEach(row => {
    const header = section.querySelector(`.acc-header[data-paper-row="${CSS.escape(row)}"]`);
    if (!header) return;
    const body = document.getElementById(header.getAttribute('aria-controls'));
    header.setAttribute('aria-expanded', 'true');
    body?.classList.add('open');
  });
  window.scrollTo(0, state.scrollY);
}

async function loadScreeningResults(batchId, preserveView = false) {
  _screeningSelectedBatch = batchId;
  const section = document.getElementById('screeningResultsSection');
  const viewState = preserveView ? screeningViewState(section) : null;
  if (!preserveView) section.innerHTML = '<h2 class="section-title" style="font-size:var(--font-lg);margin-top:var(--space-6)">Results</h2><p class="empty">Loading…</p>';
  const res = await fetch(`/screening/${batchId}/results`);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    section.innerHTML = `<h2 class="section-title" style="font-size:var(--font-lg);margin-top:var(--space-6)">Results</h2><p class="empty">${esc(err.detail || 'No results yet — click Run.')}</p>`;
    return;
  }
  const data = await res.json();
  const [agreement, calibration] = await Promise.all([
    fetch(`/screening/${batchId}/agreement`).then(r => r.json()),
    data.papers.some(p => p.backend === 'llm') ? Promise.resolve(null) : fetch(`/screening/${batchId}/calibration`).then(r => r.json()),
  ]);
  _screeningCurrentResults = data;
  _screeningCurrentAgreement = agreement;
  _screeningCurrentCalibration = calibration;
  section.innerHTML = screeningResultsHTML(data, agreement, calibration);
  restoreScreeningViewState(section, viewState);
}

function decisionBadgeHTML(label, decision) {
  const cls = { Include: 'decision-include', 'Likely include': 'decision-include', Exclude: 'decision-exclude', Maybe: 'decision-maybe', 'Missing abstract': 'decision-missing' }[decision] || 'decision-missing';
  return `<span class="decision ${cls}">${esc(label)}</span>`;
}

function screeningNumber(value, fallback = null) {
  return typeof value === 'number' && Number.isFinite(value) ? value : fallback;
}

function sortedScreeningPapers(papers) {
  const rows = papers.filter(p => {
    if (_screeningFilter === 'all') return true;
    if (_screeningFilter === 'attention') return p.screening_status !== 'screened' || (p.consensus && !p.consensus.decision);
    if (_screeningFilter === 'unreviewed' && p.consensus) return (p.consensus.status === 'awaiting_second_reviewer' && p.consensus.roles?.second_reviewer === 'human') || (p.consensus.status === 'awaiting_judge' && p.consensus.roles?.judge === 'human');
    if (_screeningFilter === 'reviewed' && p.consensus) return p.consensus.second_reviewer?.kind === 'human' || p.consensus.judge?.kind === 'human';
    if (_screeningFilter === 'unreviewed') return (p.screening_status || 'screened') === 'screened' && (p.criteria.length ? p.criteria.some(c => !c.human_decision) : !p.human_decision);
    if (_screeningFilter === 'reviewed') return (p.criteria.length ? p.criteria.every(c => Boolean(c.human_decision)) : Boolean(p.human_decision));
    if (_screeningFilter === 'missing') return (p.screening_status || 'screened') === 'missing_abstract';
    if (_screeningFilter === 'overflow') return ['input_too_long', 'output_too_long'].includes(p.screening_status);
    return (p.consensus ? p.consensus.decision : p.decision) === _screeningFilter;
  });
  const descending = key => (a, b) =>
    screeningNumber(b[key], -Infinity) - screeningNumber(a[key], -Infinity) || a.row - b.row;
  const ascending = key => (a, b) =>
    screeningNumber(a[key], Infinity) - screeningNumber(b[key], Infinity) || a.row - b.row;
  const sorter = {
    inclusion_first: (a, b) => {
      const group = p => ({ Include: 0, 'Likely include': 1, Maybe: 2, Exclude: 3 }[(p.consensus ? p.consensus.decision : p.decision)] ?? 4);
      const support = p => {
        const includes = p.criteria.filter(c => c.type === 'include' && (p.decision !== 'Likely include' || c.criterion_decision === 'passed'));
        return includes.length ? Math.min(...includes.map(c => c.entailment)) : -1;
      };
      const gaps = p => p.criteria.filter(c => c.criterion_decision === 'unresolved').length;
      return group(a) - group(b) ||
        (a.decision === 'Likely include' ? gaps(a) - gaps(b) : 0) ||
        (a.decision === 'Exclude'
          ? screeningNumber(b.decision_confidence, -1) - screeningNumber(a.decision_confidence, -1)
          : support(b) - support(a)) || a.row - b.row;
    },
    review_order: (a, b) => a.review_order.group_rank - b.review_order.group_rank ||
      a.review_order.blocking_count - b.review_order.blocking_count ||
      screeningNumber(a.review_order.score_gap, Infinity) - screeningNumber(b.review_order.score_gap, Infinity) || a.row - b.row,
    confidence_asc: ascending('decision_confidence'),
    confidence_desc: descending('decision_confidence'),
    original: (a, b) => a.row - b.row,
  }[_screeningSort];
  return rows.sort(sorter);
}

function changeScreeningSort(value) {
  _screeningSort = value;
  if (_screeningCurrentResults && _screeningCurrentAgreement) {
    document.getElementById('screeningResultsSection').innerHTML = screeningResultsHTML(
      _screeningCurrentResults, _screeningCurrentAgreement
    );
  }
}

function changeScreeningFilter(value) {
  _screeningFilter = value;
  if (_screeningCurrentResults && _screeningCurrentAgreement) {
    document.getElementById('screeningResultsSection').innerHTML = screeningResultsHTML(
      _screeningCurrentResults, _screeningCurrentAgreement
    );
  }
}

function changeScreeningReviewMode(value) {
  _screeningReviewMode = value;
  if (_screeningCurrentResults && _screeningCurrentAgreement) {
    document.getElementById('screeningResultsSection').innerHTML = screeningResultsHTML(
      _screeningCurrentResults, _screeningCurrentAgreement
    );
  }
}

function calibrationMetric(value) {
  return typeof value === 'number' ? `${Math.round(value * 100)}%` : '—';
}

function criterionDiagnosticsHTML(criteria) {
  const explanations = {
    frequently_neutral: 'Frequently neutral: check wording, missing abstract evidence, or move assessment to full text.',
    frequently_uncertain: 'Frequently uncertain: check ambiguous wording and review examples before changing the threshold.',
  };
  return `<div class="card">
    <div class="card-heading">Criterion diagnostics</div>
    <p class="field-hint">All screened papers, using current criterion thresholds. Confident neutral and below-threshold findings are counted separately.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Criterion</th><th>Papers assessed</th><th>Confident neutral</th><th>Uncertain</th><th>Flags</th></tr></thead>
      <tbody>${criteria.map(c => {
        const d = c.diagnostics;
        return `<tr><td>${esc(c.label)}</td><td>${d.assessed}</td>
          <td>${d.neutral_count} (${calibrationMetric(d.neutral_rate)})</td>
          <td>${d.uncertain_count} (${calibrationMetric(d.uncertain_rate)})</td>
          <td>${d.enough_papers ? d.flags.map(flag => esc(explanations[flag])).join('<br>') || 'No frequency flags' : 'Too few papers for frequency flags'}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}

function screeningCalibrationHTML(batchId, calibration) {
  if (!calibration) return '<p>LLM screening uses the configured response contract. There are no criterion scores or thresholds to calibrate.</p>';
  const current = calibration.current;
  const suggested = calibration.suggested;
  const diagnostics = criterionDiagnosticsHTML(calibration.criteria);
  if (!current.reviewed) return `${diagnostics}
    <div class="card">
      <div class="card-heading">Threshold calibration</div>
      <p class="field-hint">Review individual criterion decisions to generate criterion-specific threshold suggestions. Final paper labels are not used for calibration.</p>
    </div>`;
  return `${diagnostics}
    <div class="card">
      <div class="card-heading">Threshold calibration</div>
      <p style="margin-bottom:var(--space-3)">${esc(calibration.warning)}</p>
      <div class="table-wrap"><table>
        <thead><tr><th></th><th>Accepted findings</th><th>Agreements</th><th>Disagreements</th><th>Disagreement rate</th><th>Below threshold</th></tr></thead>
        <tbody>${[['Current', current], ['Suggested', suggested]].map(([name, m]) => `<tr>
          <th>${name}</th><td>${m.accepted}/${m.reviewed}</td><td>${m.agreements}</td>
          <td>${m.disagreements}</td><td>${calibrationMetric(m.disagreement_rate)}</td><td>${m.uncertain}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <div class="table-wrap" style="margin-top:var(--space-3)"><table>
        <thead><tr><th>Criterion</th><th>Reviews</th><th>Current threshold</th><th>Suggested/editable</th><th>Resampled threshold range</th><th>Tuning status / allowed disagreement</th><th></th></tr></thead>
        <tbody>${calibration.criteria.map((criterion, index) => `
          <tr>
            <td>${esc(criterion.label)}</td>
            <td>${criterion.reviewed}${criterion.ready ? ' ✓' : ''}</td>
            <td>${criterion.current_threshold}</td>
            <td><input class="field-input" id="calibration-threshold-${index}" type="number" min="0.5" max="1" step="any" style="width:110px" value="${criterion.suggested_threshold}"></td>
            <td>${criterion.stability.lower === null ? 'Not available' : criterion.stability.lower.toFixed(4) + ' - ' + criterion.stability.upper.toFixed(4)}</td>
            <td>${esc({suggested: 'Suggestion available', no_reviews: 'No usable reviews', no_feasible_threshold: 'No feasible threshold'}[criterion.tuning_status])} / ${calibrationMetric(criterion.max_disagreement_rate)}<br>${esc(criterion.stability.status)}</td>
            <td><button type="button" class="btn-sm" onclick="applyScreeningCalibration('${batchId}',${index})">Apply this only</button></td>
          </tr>`).join('')}</tbody>
      </table></div>
      <p class="field-hint">Accepted means the winning finding reaches the threshold, including neutral. It does not mean the paper is eligible. No feasible threshold means the current value is retained without endorsement. Optional resampling describes variability; it does not veto a suggestion.</p>
      <div class="toolbar" style="margin-top:var(--space-3);margin-bottom:0">
        <button type="button" class="btn btn-primary" onclick="applyScreeningCalibration('${batchId}')">Apply edited thresholds and reclassify</button>
        <span id="screeningCalibrationStatus" class="status-msg"></span>
      </div>
    </div>`;
}

function screeningResultsHTML(data, agreement, calibration = _screeningCurrentCalibration) {
  const counts = { Include: 0, 'Likely include': 0, Exclude: 0, Maybe: 0, missing: 0, inputOverflow: 0, outputOverflow: 0, pending: 0 };
  data.papers.forEach(p => {
    if ((p.screening_status || 'screened') === 'missing_abstract') counts.missing++;
    else if (p.screening_status === 'input_too_long') counts.inputOverflow++;
    else if (p.screening_status === 'output_too_long') counts.outputOverflow++;
    else if (p.consensus && !p.consensus.decision) counts.pending++;
    else { const decision = p.consensus ? p.consensus.decision : p.decision; if (decision in counts) counts[decision]++; }
  });
  const sorted = sortedScreeningPapers(data.papers);
  const criterionTotal = data.papers.reduce((total, paper) => total + paper.criteria.length, 0);
  const criterionReviewed = data.papers.reduce((total, paper) => total + paper.criteria.filter(c => c.human_decision).length, 0);
  const pendingLlmJudges = data.papers.filter(p =>
    ['awaiting_judge', 'judge_failed'].includes(p.consensus?.status) && p.consensus?.roles?.judge === 'llm'
  ).length;
  const agreementHTML = agreement.reviewed
    ? `<span class="status-msg">Your confirmed labels: ${agreement.agreeing}/${agreement.reviewed} agree with the model (${Math.round(agreement.agreement_rate * 100)}%)</span>`
    : `<span class="field-hint">Expand a paper below and confirm Include/Exclude/Maybe to build an agreement check here.</span>`;
  return `
    <div class="toolbar" style="margin-top:var(--space-6)">
      <h2 class="section-title" style="font-size:var(--font-lg);margin-bottom:0">Results</h2>
      <span class="status-msg">${data.papers.length} paper(s) · ${decisionBadgeHTML(counts.Include + ' include', 'Include')} · ${decisionBadgeHTML(counts.Exclude + ' exclude', 'Exclude')} · ${decisionBadgeHTML(counts.Maybe + ' maybe', 'Maybe')}</span>
      ${decisionBadgeHTML(counts['Likely include'] + ' likely include', 'Likely include')}
      ${decisionBadgeHTML(counts.missing + ' missing abstract', 'Missing abstract')}
      ${counts.pending ? `<span class="tag">${counts.pending} awaiting panel decision</span>` : ''}
      ${pendingLlmJudges ? `<button type="button" class="btn btn-primary" onclick="runPanelJudges('${data.batch_id}')">Continue all pending (${pendingLlmJudges})</button>` : ''}
      <span id="panelJudgeStatus" class="status-msg" role="status" aria-live="polite"></span>
      ${counts.inputOverflow ? decisionBadgeHTML(counts.inputOverflow + ' input too long', 'Input too long') : ''}
      ${counts.outputOverflow ? decisionBadgeHTML(counts.outputOverflow + ' output budget exhausted', 'Output too long') : ''}
      <label class="field-label" for="screeningFilter">Show
        <select class="field-input" id="screeningFilter" onchange="changeScreeningFilter(this.value)" style="width:auto;display:inline-block;margin-left:6px">
          <option value="all" ${_screeningFilter === 'all' ? 'selected' : ''}>All records</option>
          <option value="unreviewed" ${_screeningFilter === 'unreviewed' ? 'selected' : ''}>Needs human review</option>
          <option value="reviewed" ${_screeningFilter === 'reviewed' ? 'selected' : ''}>Human-reviewed only</option>
          <option value="Likely include" ${_screeningFilter === 'Likely include' ? 'selected' : ''}>Likely include only</option>
          <option value="Maybe" ${_screeningFilter === 'Maybe' ? 'selected' : ''}>Maybe only</option>
          <option value="Include" ${_screeningFilter === 'Include' ? 'selected' : ''}>Include only</option>
          <option value="Exclude" ${_screeningFilter === 'Exclude' ? 'selected' : ''}>Exclude only</option>
          <option value="attention" ${_screeningFilter === 'attention' ? 'selected' : ''}>Needs processing</option>
          <option value="missing" ${_screeningFilter === 'missing' ? 'selected' : ''}>Missing abstract only</option>
          <option value="overflow" ${_screeningFilter === 'overflow' ? 'selected' : ''}>Input/output too long</option>
        </select>
      </label>
      <label class="field-label" for="screeningSort">Sort
        <select class="field-input" id="screeningSort" onchange="changeScreeningSort(this.value)" style="width:auto;display:inline-block;margin-left:6px">
          <option value="inclusion_first" ${_screeningSort === 'inclusion_first' ? 'selected' : ''}>Inclusion first</option>
          <option value="review_order" ${_screeningSort === 'review_order' ? 'selected' : ''}>Review priority</option>
          <option value="confidence_asc" ${_screeningSort === 'confidence_asc' ? 'selected' : ''}>Least confident</option>
          <option value="confidence_desc" ${_screeningSort === 'confidence_desc' ? 'selected' : ''}>Most confident</option>
          <option value="original" ${_screeningSort === 'original' ? 'selected' : ''}>Spreadsheet order</option>
        </select>
      </label>
      <label class="field-label" for="screeningReviewMode">Review mode
        <select class="field-input" id="screeningReviewMode" onchange="changeScreeningReviewMode(this.value)" style="width:auto;display:inline-block;margin-left:6px">
          <option value="operational" ${_screeningReviewMode === 'operational' ? 'selected' : ''}>Operational: show model</option>
          <option value="calibration" ${_screeningReviewMode === 'calibration' ? 'selected' : ''}>Calibration: decide first</option>
        </select>
      </label>
      <a class="btn btn-secondary" href="/screening/${data.batch_id}/results.xlsx" download>Download Excel</a>
    </div>
    <p class="field-hint" style="display:block;margin-bottom:var(--space-3)">${_screeningReviewMode === 'operational' ? 'Machine-first review: inspect the model assessment, then confirm or correct it.' : 'Blind calibration: the model assessment stays hidden until you decide, reducing anchoring in your assessments.'}</p>
    <p style="margin-bottom:var(--space-4)">${agreementHTML} <span class="field-hint">Criterion reviews: ${criterionReviewed}/${criterionTotal}</span></p>
    <section class="card" aria-label="Full-text recovery">
      <div class="card-heading">Papers to recover</div>
      <p>Recover full texts for Include, Likely include, and Maybe records, plus records with missing abstracts. Your paper-level decision takes precedence; Exclude records are omitted. Failed screening records must be rerun or assigned a paper-level decision.</p>
      <p>For recovery without a citation-list import, save PDFs under the exact filenames in the recovery list. Otherwise use the import below. Recovery does not confirm full-text eligibility.</p>
      <div class="toolbar">
        <a class="btn btn-secondary" href="/screening/${data.batch_id}/recovery.csv" download>Download recovery list</a>
        <button type="button" class="btn btn-secondary" onclick="checkScreeningRecovery('${data.batch_id}')">Check recovered PDFs</button>
      </div>
      <p>Import your reviewer citation list (CSV/XLSX) with a <code>pdf_path</code> column. Paths are relative to the PDF input folder; put original files in a subfolder such as <code>library/</code>. Confirm each proposed link below. Original PDFs remain unchanged.</p>
      <a href="/screening/${data.batch_id}/recovery/template.csv" download>Download reviewer list template</a>
      <input type="file" accept=".csv,.xlsx" aria-label="Reviewer citation list" onchange="previewRecoveryLibrary('${data.batch_id}', this.files[0])">
      <div id="recoveryLibraryPreview" aria-live="polite"></div>
      <div id="screeningRecoveryStatus" aria-live="polite"></div>
    </section>
    ${screeningCalibrationHTML(data.batch_id, calibration)}
    <p class="field-hint">${data.papers.some(p => p.backend === 'llm') ? 'LLM review order uses uncertain findings and missing evidence, without confidence scores. Ties keep original row order.' : 'Review order: uncertain Maybe, missing-evidence Maybe, Likely include, then optional checks. Within each group: fewer blocking criteria, then smaller top-two score gap. Ties keep original row order.'}</p>
    <div class="accordion">${sorted.filter(p => p.screening_status === 'screened').map((p, i) => screeningRowHTML(p, i, data.batch_id)).join('')}</div>
    ${sorted.some(p => p.screening_status !== 'screened') ? '<h3>Needs processing</h3><p>Complete missing abstracts, resolve oversized inputs, or retry failed screening.</p>' : ''}
    <div class="accordion">${sorted.filter(p => p.screening_status !== 'screened').map((p, i) => screeningRowHTML(p, i, data.batch_id)).join('')}</div>`;
}

let _recoveryLibrary = null;

async function previewRecoveryLibrary(batchId, file) {
  if (!file) return;
  const element = document.getElementById('recoveryLibraryPreview');
  element.textContent = 'Reading citation list and checking PDFs...';
  _recoveryLibrary = null;
  try {
    const form = new FormData();
    form.append('file', file);
    const response = await fetch(`/screening/${batchId}/recovery/import`, {method: 'POST', body: form});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Import failed');
    if (!element.isConnected || _screeningSelectedBatch !== batchId) return;
    _recoveryLibrary = {batchId, ...data};
    element.innerHTML = `<p>${data.records.length} records. Matching uses citation metadata supplied in your list; it does not verify the PDF's article identity. Check the selected paper before confirming.</p>
      <datalist id="recovery-targets">${data.targets.map(p => `<option value="${p.row}">${esc(p.title)} ${esc(p.doi || '')}</option>`).join('')}</datalist>
      <div class="table-wrap"><table><thead><tr><th>Reviewer citation</th><th>PDF path</th><th>Match</th><th>Screening record</th><th></th></tr></thead>
      <tbody>${data.records.map((r, i) => {
        const selected = r.match_status === 'proposed' && r.candidates.length === 1 ? r.candidates[0].row : null;
        return `<tr><td>${esc(r.title || r.doi)}<br>${esc(r.doi)} ${esc(r.year)}</td><td>${esc(r.pdf_path)}</td>
          <td>${esc(r.file_error || r.match_status)}</td>
          <td><input id="recovery-target-${i}" list="recovery-targets" value="${selected ?? ''}" placeholder="Screening row" aria-label="Screening record for imported row ${r.library_row}"></td><td><button type="button" class="btn-sm" ${r.file_error ? 'disabled' : ''} onclick="confirmRecoveryLink('${batchId}',${i},this)">Confirm link</button><span id="recovery-link-status-${i}"></span></td></tr>`;
      }).join('')}</tbody></table></div>`;
  } catch (error) {
    if (element.isConnected) element.textContent = error.message;
  }
}

async function confirmRecoveryLink(batchId, index, button) {
  const library = _recoveryLibrary;
  if (!library || library.batchId !== batchId) return;
  const status = document.getElementById(`recovery-link-status-${index}`);
  const target = Number(document.getElementById(`recovery-target-${index}`).value);
  if (!target) { status.textContent = ' Select a screening record'; return; }
  button.disabled = true;
  try {
    const response = await fetch(`/screening/${batchId}/recovery/link`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({import_id: library.import_id, library_row: library.records[index].library_row, screening_row: target}),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Link failed');
    status.textContent = ' Linked';
    await checkScreeningRecovery(batchId);
  } catch (error) {
    status.textContent = ' ' + error.message;
    button.disabled = false;
  }
}

async function checkScreeningRecovery(batchId) {
  const element = document.getElementById('screeningRecoveryStatus');
  element.textContent = 'Checking folder…';
  try {
    const response = await fetch(`/screening/${batchId}/recovery`);
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Could not check recovered PDFs');
    if (_screeningSelectedBatch !== batchId || !element.isConnected) return;
    const present = data.papers.filter(p => p.file_status === 'present').length;
    element.innerHTML = `<p>Input folder: <code>${esc(data.folder)}</code></p><p>${present} / ${data.papers.length} PDFs found. Open a recovered paper to continue with parsing and extraction. File presence checks the PDF signature; parsing checks whether it can be processed.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Title</th><th>Decision</th><th>PDF filename</th><th>File status</th><th></th></tr></thead>
        <tbody>${data.papers.map(p => `<tr>
          <td>${esc(p.title || '(No title)')}</td><td>${esc(p.decision || 'Missing abstract')}</td>
          <td><code>${esc(p.pdf_filename)}</code></td><td>${esc(p.file_status)}</td>
          <td>${p.file_status === 'present' ? `<button type="button" class="btn-sm" onclick="selectPaper('${p.record_id}')">Open paper</button>` : ''}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    await refreshPapers();
  } catch (error) {
    element.textContent = error.message;
  }
}

function nliScoreBarHTML(label, value, className, threshold = null) {
  const score = screeningNumber(value, 0);
  const pct = Math.max(0, Math.min(100, score * 100));
  const marker = threshold === null ? '' : `<span class="nli-threshold-marker" style="left:${Math.max(0, Math.min(100, threshold * 100))}%" title="Threshold ${threshold.toFixed(2)}"></span>`;
  return `
    <div class="nli-score-row">
      <span class="nli-score-label">${label}</span>
      <div class="nli-score-track" role="img" aria-label="${label} probability ${score.toFixed(3)}${threshold === null ? '' : `, threshold ${threshold.toFixed(2)}`}">
        <div class="nli-score-fill ${className}" style="width:${pct}%"></div>${marker}
      </div>
      <span class="nli-score-value">${score.toFixed(3)}</span>
    </div>`;
}

function unresolvedReasonHTML(criterion, decision, threshold) {
  if (decision !== 'unresolved') return '';
  const scores = ['entailment', 'contradiction', 'neutral'].map(label => [
    label, screeningNumber(criterion[label], 0),
  ]).sort((a, b) => b[1] - a[1]);
  const [winner, score] = scores[0];
  const message = criterion.finding === 'not_established' ? 'The model favors neutral: the statement is not established by this text.' : criterion.finding === 'uncertain' ? 'No class reaches its threshold; the finding is uncertain.' : winner === 'neutral'
    ? `Neutral is the highest probability (${score.toFixed(3)}). Changing the threshold cannot make this decision automatic.`
    : `${winner[0].toUpperCase() + winner.slice(1)} is highest (${score.toFixed(3)}) but below the ${threshold.toFixed(2)} threshold.`;
  return `<p class="field-hint" style="display:block;margin-bottom:var(--space-3)">${esc(message)}</p>`;
}

function screeningCriteriaRowsHTML(criteria, batchId, paperRow) {
  const labels = { passed: 'Passed', failed: 'Failed', cleared: 'Cleared', hit: 'Exclusion hit', unresolved: 'Unresolved' };
  const decisions = { passed: 'Include', cleared: 'Include', failed: 'Exclude', hit: 'Exclude', unresolved: 'Maybe' };
  return criteria.map((c, criterionIndex) => {
    const criterionDecision = c.criterion_decision || 'unresolved';
    const threshold = screeningNumber(c.confidence_threshold, 0.8);
    const humanLabels = c.type === 'include'
      ? [['passed', 'Supported'], ['failed', 'Contradicted'], ['unresolved', c.backend === 'llm' ? 'Uncertain' : 'Not established']]
      : [['hit', 'Supported'], ['cleared', 'Contradicted'], ['unresolved', c.backend === 'llm' ? 'Uncertain' : 'Not established']];
    const reviewedClass = ({supported: 'entailment', contradicted: 'contradiction', not_established: 'neutral'})[c.human_finding];
    const agrees = c.backend === 'llm' && c.human_finding ? c.human_finding === c.finding : reviewedClass ? reviewedClass === c.status : c.human_decision === criterionDecision;
    const humanLabel = humanLabels.find(item => item[0] === c.human_decision)?.[1] || c.human_decision;
    const reviewerButtons = humanLabels.map(item => `<button type="button" class="btn-sm ${c.human_decision === item[0] ? 'selected' : ''}" aria-pressed="${c.human_decision === item[0]}" onclick="confirmScreeningCriterionLabel('${batchId}',${paperRow},${criterionIndex},'${item[0]}',${c.backend === 'llm'})">${item[1]}</button>`).join('');
    const showModel = _screeningReviewMode === 'operational' || Boolean(c.human_decision);
    const modelPanel = showModel ? `
      <div class="model-assessment">
        <div class="model-assessment-heading">
          <span class="field-label">Model assessment</span>
          ${decisionBadgeHTML(labels[criterionDecision] || criterionDecision, decisions[criterionDecision] || 'Maybe')}
          <span class="review-agreement ${agrees ? 'yes' : 'no'}">${!c.human_decision ? 'Not reviewed' : agrees ? 'Agrees with reviewer' : 'Disagrees with reviewer'}</span>
          ${c.backend === 'llm' ? `<span class="field-hint">${esc(c.finding)}</span>` : `<span class="field-hint">threshold ${threshold.toFixed(2)}</span>`}
        </div>
        ${c.explicit_evidence_required && (c.finding === 'not_established' || c.backend === 'llm' && c.finding === 'uncertain') && criterionDecision === 'failed'
          ? '<p class="field-hint">Rejected because this inclusion criterion requires explicit abstract evidence.</p>' : ''}
        ${c.backend === 'llm' ? `${c.quote != null ? `<blockquote>${esc(c.quote)}</blockquote>` : ''}${c.model_confidence != null ? `<p>Model-reported confidence (uncalibrated): ${esc(String(c.model_confidence))}</p>` : ''}<p class="field-hint">${esc(c.reason || ({uncertain: 'Evidence is missing, insufficient, ambiguous, or conflicting.', not_established: 'The text does not establish or refute this criterion.'}[c.finding] || ''))}</p>` : `
        ${unresolvedReasonHTML(c, criterionDecision, threshold)}
        ${nliScoreBarHTML('Entailment', c.entailment, 'nli-score-entailment', threshold)}
        ${nliScoreBarHTML('Contradiction', c.contradiction, 'nli-score-contradiction', threshold)}
        ${nliScoreBarHTML('Neutral', c.neutral, 'nli-score-neutral', threshold)}`}
      </div>` : '<div class="model-hidden">Model assessment is hidden until you review this criterion.</div>';
    return `
      <div class="criterion-review-card">
        <div class="criterion-review-heading">
          <div><strong>${esc(c.label)}</strong> <span class="field-hint">${esc(c.type)} criterion</span></div>
          ${c.human_decision ? `<span class="tag">reviewer: ${esc(humanLabel)}</span>` : '<span class="field-hint">Not reviewed</span>'}
        </div>
        <p style="margin-bottom:var(--space-3);color:var(--color-text-secondary)">${esc(c.statement || '')}</p>
        <div class="criterion-review-actions">
          <span class="field-label">Your assessment</span>
          ${reviewerButtons}
          ${c.human_decision ? `<button type="button" class="btn-sm" onclick="confirmScreeningCriterionLabel('${batchId}',${paperRow},${criterionIndex},null)">Clear</button>` : ''}
        </div>
        ${modelPanel}
      </div>`;
  }).join('');
}

function screeningRowHTML(p, i, batchId) {
  const bodyId = `screening-row-${p.row}`;
  const blindSecond = p.consensus?.roles?.second_reviewer === 'human' && !p.consensus.second_reviewer;
  const humanBadge = p.human_decision ? decisionBadgeHTML(`you: ${p.human_decision}`, p.human_decision) : '';
  const isMissing = (p.screening_status || 'screened') === 'missing_abstract';
  const isOverflow = p.screening_status === 'input_too_long';
  const isOutputOverflow = p.screening_status === 'output_too_long';
  const shownDecision = p.consensus ? (p.consensus.decision || p.consensus.status.replaceAll('_', ' ')) : p.reason === 'free_text_requires_review' ? 'Read model answer' : isOverflow ? 'Input too long' : isOutputOverflow ? 'Output budget exhausted' : isMissing ? 'Missing abstract' : p.screening_status === 'screening_failed' ? 'Screening failed' : (p.decision || 'Maybe');
  const order = p.review_order;
  const groupLabel = {uncertain: 'Uncertain findings', missing_evidence: 'Missing evidence', confirm_inclusion_gaps: 'Confirm inclusion gaps', optional_check: 'Optional check', needs_processing: 'Needs processing'}[order.group];
  const metrics = p.backend === 'llm' ? `${groupLabel} | ${order.blocking_count} blocking` : order.group === 'needs_processing' ? '' : `${groupLabel} | ${order.blocking_count} blocking | score gap ${order.score_gap === null ? 'N/A' : order.score_gap.toFixed(3)}`;
  return `
    <div>
      <button type="button" class="acc-header" data-paper-row="${esc(String(p.row))}" aria-expanded="false" aria-controls="${bodyId}" onclick="toggleAcc(this)">
        <span style="flex:1;text-align:left">${esc(p.title || '(no title)')}</span>
        <span class="acc-meta">${decisionBadgeHTML(shownDecision, shownDecision)} ${p.consensus ? '' : humanBadge} &nbsp;${blindSecond ? '' : metrics}</span>
      </button>
      <div class="acc-body" id="${bodyId}">
        <p style="font-size:var(--font-base);color:var(--color-text-secondary);margin-bottom:var(--space-3);white-space:pre-wrap">${esc(p.abstract || '(no abstract)')}</p>
        <p class="field-hint" style="display:block;margin-bottom:var(--space-3)">Decision reason: ${blindSecond ? 'Independent second review pending' : esc(p.reason || 'not recorded')}</p>
        ${(p.input_issues || []).map(issue => `<p>${esc(issue.criterion)}: ${issue.token_count} tokens / ${issue.token_limit} limit (${issue.excess_tokens} over). No paper decision was made.</p>`).join('')}
        ${blindSecond ? '' : screeningCriteriaRowsHTML(p.criteria, batchId, p.row)}
        ${p.consensus ? screeningPanelHTML(p, batchId) : ''}
        ${!blindSecond && p.backend === 'llm' && (_screeningReviewMode === 'operational' || p.human_decision) ? `
          <p>Model output: <strong>${esc(p.llm_output?.text || p.llm_output?.decision || p.decision || 'No valid decision')}</strong></p>
          ${p.llm_output && !p.llm_output.criteria ? `${p.llm_output.reason ? `<p>${esc(p.llm_output.reason)}</p>` : ''}${p.llm_output.quote != null ? `<blockquote>${esc(p.llm_output.quote)}</blockquote>` : ''}${p.llm_output.confidence != null ? `<p>Model-reported confidence (uncalibrated): ${esc(String(p.llm_output.confidence))}</p>` : ''}` : ''}
          <details><summary>Inspect model input and raw output</summary>
            ${p.llm_calls?.length ? `<pre style="white-space:pre-wrap">${esc(JSON.stringify(p.llm_calls, null, 2))}</pre>` : ''}
            <pre style="white-space:pre-wrap">${esc(JSON.stringify(p.llm_request, null, 2))}</pre>
            <pre style="white-space:pre-wrap">${esc(p.llm_response || '(no response)')}</pre>
            ${p.llm_attempts?.length ? `<pre style="white-space:pre-wrap">${esc(JSON.stringify(p.llm_attempts, null, 2))}</pre>` : ''}
          </details>` : ''}
        ${p.consensus ? '' : isOverflow ? '<p>Review this record or shorten its input before rerunning screening.</p>' : isOutputOverflow ? '<p>The model exhausted the enlarged retry budget. Increase the initial budget or retry multiplier, then rerun screening.</p>' : isMissing ? '<p class="field-hint">No model decision was made. Complete the abstract before screening this record.</p>' : `<div class="toolbar" style="margin-top:var(--space-3);margin-bottom:0">
          <span class="field-hint">Optional final paper judgment:</span>
          <button type="button" class="btn-sm" onclick="confirmScreeningLabel('${batchId}', ${p.row}, 'Include')">Include</button>
          <button type="button" class="btn-sm" onclick="confirmScreeningLabel('${batchId}', ${p.row}, 'Exclude')">Exclude</button>
          <button type="button" class="btn-sm" onclick="confirmScreeningLabel('${batchId}', ${p.row}, 'Likely include')">Likely include</button>
          <button type="button" class="btn-sm" onclick="confirmScreeningLabel('${batchId}', ${p.row}, 'Maybe')">Maybe (provisional)</button>
          ${p.human_decision ? `<button type="button" class="btn-sm" onclick="confirmScreeningLabel('${batchId}', ${p.row}, null)">Clear</button>` : ''}
        </div>`}
      </div>
    </div>`;
}

function screeningAssessmentHTML(label, assessment) {
  if (!assessment) return '';
  const criteria = (assessment.criteria || []).map(item => `
    <li><strong>${esc(item.label || 'Criterion')}:</strong> ${esc(item.finding || item.criterion_decision || 'not recorded')}
      ${item.reason ? ` — ${esc(item.reason)}` : ''}${item.quote ? `<blockquote>${esc(item.quote)}</blockquote>` : ''}</li>`).join('');
  return `<div class="criterion-review-card">
    <div class="criterion-review-heading"><strong>${esc(label)}</strong><span class="tag">${esc(assessment.kind || 'reviewer')}${assessment.model ? `: ${esc(assessment.model)}` : ''}</span></div>
    <p>Decision: <strong>${esc(assessment.decision || 'Failed')}</strong></p>
    ${assessment.reason ? `<p>${esc(assessment.reason)}</p>` : '<p class="field-hint">No reason recorded.</p>'}
    ${assessment.quote ? `<blockquote>${esc(assessment.quote)}</blockquote>` : ''}
    ${assessment.confidence != null ? `<p class="field-hint">Model-reported confidence (uncalibrated): ${esc(String(assessment.confidence))}</p>` : ''}
    ${criteria ? `<ul>${criteria}</ul>` : ''}
  </div>`;
}

function screeningPanelHTML(p, batchId) {
  const panel = p.consensus;
  const waiting = panel.status === 'awaiting_second_reviewer' ? 'second_reviewer' : panel.status === 'awaiting_judge' ? 'judge' : null;
  const role = waiting && panel.roles?.[waiting] === 'human' ? waiting : null;
  const primary = panel.primary || {kind: 'llm', decision: p.decision, reason: p.llm_output?.reason, quote: p.llm_output?.quote, confidence: p.llm_output?.confidence, criteria: p.criteria};
  const visible = panel.second_reviewer
    ? screeningAssessmentHTML('Primary reviewer', primary)
      + screeningAssessmentHTML('Second reviewer', panel.second_reviewer)
      + screeningAssessmentHTML('Judge', panel.judge)
    : '';
  const reasonRule = role === 'judge' && panel.require_judge_reason ? ' required' : ' optional';
  return `<p><strong>Review panel: ${esc(panel.status.replaceAll('_', ' '))}</strong></p>
    <ul>${(panel.criteria || []).map(c => `<li>${esc(c.type)}: ${esc(c.statement)}${c.explicit_evidence_required ? ' (explicit evidence required)' : ''}</li>`).join('')}</ul>
    ${visible}
    ${role ? `<p>Your role: ${esc(role.replaceAll('_', ' '))}</p><textarea id="panel-reason-${p.row}" placeholder="Reason (${reasonRule.trim()})"></textarea>
      ${['Include', 'Exclude'].map(decision => `<button class="btn-sm" onclick="submitPanelReview('${batchId}',${p.row},'${role}','${decision}','${panel.fingerprint}')">${decision}</button>`).join('')}` : ''}
    ${waiting === 'judge' && panel.roles?.judge === 'llm' ? `<button class="btn-sm" onclick="runPanelJudges('${batchId}',${p.row})">Continue with judge</button>` : ''}
    ${panel.second_reviewer ? `<details><summary>Review audit</summary><pre>${esc(JSON.stringify(panel, null, 2))}</pre></details>` : ''}`;
}

async function runPanelJudges(batchId, row = null) {
  const status = document.getElementById('panelJudgeStatus');
  if (status) { status.textContent = 'Adjudication queued…'; status.className = 'status-msg pending'; }
  const url = row == null
    ? `/screening/${batchId}/panel/judge/run`
    : `/screening/${batchId}/papers/${row}/panel/judge/run`;
  const response = await fetch(url, {method: 'POST'});
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    if (status) { status.textContent = body.detail || 'Could not start adjudication'; status.className = 'status-msg err'; }
    else alert(body.detail || 'Could not start adjudication');
    return;
  }
  const timer = setInterval(async () => {
    const job = await fetch(`/jobs/${body.job_id}`).then(result => result.json());
    if (job.status !== 'done' && job.status !== 'error') return;
    clearInterval(timer);
    if (job.status === 'error') {
      if (status) { status.textContent = `Adjudication failed: ${job.error}`; status.className = 'status-msg err'; }
      else alert(`Adjudication failed: ${job.error}`);
      return;
    }
    await loadScreeningResults(batchId, true);
  }, 1500);
}

async function submitPanelReview(batchId, row, role, decision, fingerprint) {
  const response = await fetch(`/screening/${batchId}/papers/${row}/panel/${role}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({decision, fingerprint, reason: document.getElementById(`panel-reason-${row}`).value}),
  });
  if (!response.ok) { alert((await response.json()).detail || 'Could not save review'); return; }
  await loadScreeningResults(batchId, true);
}

async function confirmScreeningLabel(batchId, row, decision) {
  await fetch(`/screening/${batchId}/papers/${row}/label`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ human_decision: decision }),
  });
  await loadScreeningResults(batchId, true);
}

async function confirmScreeningCriterionLabel(batchId, row, criterionIndex, decision, isLlm = false) {
  await fetch(`/screening/${batchId}/papers/${row}/criteria/${criterionIndex}/label`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ human_decision: decision, human_finding: ({passed: 'supported', hit: 'supported', failed: 'contradicted', cleared: 'contradicted', unresolved: isLlm ? 'uncertain' : 'not_established'})[decision] ?? null }),
  });
  await loadScreeningResults(batchId, true);
}

async function applyScreeningCalibration(batchId, onlyIndex = null) {
  if (!confirm('Apply these criterion thresholds and reclassify this batch?')) return;
  const criteria = _screeningCurrentCalibration.criteria;
  const criterionThresholds = {};
  criteria.forEach((criterion, index) => {
    if (onlyIndex === null || index === onlyIndex) {
      criterionThresholds[criterion.label] = Number(document.getElementById(`calibration-threshold-${index}`).value);
    }
  });
  if (Object.values(criterionThresholds).some(value => !Number.isFinite(value) || value < 0.5 || value > 1)) {
    alert('Every threshold must be between 0.5 and 1.0.');
    return;
  }
  const status = document.getElementById('screeningCalibrationStatus');
  status.textContent = 'Applying…'; status.className = 'status-msg pending';
  const res = await fetch(`/screening/${batchId}/calibration/apply`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ criterion_thresholds: criterionThresholds }),
  });
  if (!res.ok) {
    const error = await res.json().catch(() => ({}));
    status.textContent = error.detail || 'Could not apply calibration'; status.className = 'status-msg err';
    return;
  }
  _screeningCriteria = _screeningCriteria.map(criterion => ({
    ...criterion,
    confidence_threshold: criterionThresholds[criterion.label] ?? criterion.confidence_threshold,
  }));
  await loadScreeningResults(batchId);
}


refreshPapers();
setInterval(refreshPapers, 5000);
</script>
